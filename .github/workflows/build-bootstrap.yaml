# Build LLVM-enabled bootstrap sig compiler binaries using cmake + ninja.
# Requires: pre-built LLVM 22 from build-llvm.yaml (release tag: llvm-22)
#
# Chain: build-llvm → build-bootstrap → release
name: build-bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap release tag'
        required: false
        default: 'bootstrap-sig-v5'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || 'bootstrap-sig-v5' }}
  ZIG_VERSION: "0.16.0-dev.3091+557caecaa"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            llvm_asset: llvm-22-x86_64-linux.tar.xz
            target: x86_64-linux-gnu
            artifact: bootstrap-sig-x86_64-linux
            bin: zig2
            deps: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zlib1g-dev libzstd-dev
            zlib_flag: "-DZLIB=$(find /usr/lib/x86_64-linux-gnu -name 'libz.a' 2>/dev/null | head -1)"
            zstd_flag: "-DZSTD=$(find /usr/lib/x86_64-linux-gnu -name 'libzstd.a' 2>/dev/null | head -1)"
          - os: macos-14
            llvm_asset: llvm-22-aarch64-macos.tar.xz
            target: aarch64-macos-none
            artifact: bootstrap-sig-aarch64-macos
            bin: zig2
            deps: brew install cmake ninja zstd
            zlib_flag: ""
            zstd_flag: ""
          - os: windows-latest
            llvm_asset: llvm-22-x86_64-windows.tar.xz
            target: x86_64-windows-gnu
            artifact: bootstrap-sig-x86_64-windows
            bin: zig2.exe
            deps: choco install ninja -y
            zlib_flag: ""
            zstd_flag: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        shell: bash
        run: ${{ matrix.deps }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download pre-built LLVM 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "${{ matrix.llvm_asset }}" --dir /tmp
          mkdir -p "$PWD/llvm-22"
          tar -xJf "/tmp/${{ matrix.llvm_asset }}" -C "$PWD/llvm-22" --strip-components=1
          rm "/tmp/${{ matrix.llvm_asset }}"
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build sig with cmake + ninja (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$PWD/llvm-22/bin:$PATH"
          mkdir build && cd build

          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage3" \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_USE_LLVM_CONFIG=ON \
            -DZIG_NO_LIB=ON \
            -DZIG_TARGET_TRIPLE="${{ matrix.target }}" \
            -DZIG_TARGET_MCPU="baseline" \
            ${{ matrix.zlib_flag }} \
            ${{ matrix.zstd_flag }} \
            -GNinja

          ninja ${{ matrix.bin }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

          echo "Bootstrap built:"
          file ${{ matrix.bin }} || true

      - name: Build sig with cmake + ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"

          $env:PATH = "$PWD\llvm-22\bin;$env:PATH"
          New-Item -Path 'build' -ItemType Directory | Out-Null
          Set-Location -Path 'build'

          cmake .. `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage3" `
            -DCMAKE_PREFIX_PATH="$env:LLVM_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DZIG_USE_LLVM_CONFIG=ON `
            -DZIG_NO_LIB=ON `
            -DZIG_TARGET_TRIPLE="${{ matrix.target }}" `
            -DZIG_TARGET_MCPU="baseline" `
            -GNinja

          ninja ${{ matrix.bin }}
          Write-Host "Bootstrap built"

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ matrix.artifact }}/bin
          cp build/${{ matrix.bin }} ${{ matrix.artifact }}/bin/
          # Also copy as sig/zig for compatibility
          case "${{ matrix.bin }}" in
            zig2)     cp build/${{ matrix.bin }} ${{ matrix.artifact }}/bin/sig
                      cp build/${{ matrix.bin }} ${{ matrix.artifact }}/bin/zig ;;
            zig2.exe) cp build/${{ matrix.bin }} ${{ matrix.artifact }}/bin/sig.exe
                      cp build/${{ matrix.bin }} ${{ matrix.artifact }}/bin/zig.exe ;;
          esac

          tar -czf ${{ matrix.artifact }}.tar.gz -C ${{ matrix.artifact }} .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" \
              --title "Bootstrap Sig Compiler ${VERSION}" \
              --notes "LLVM-enabled bootstrap sig built with cmake+ninja+zig." \
              --prerelease
          gh release upload "${VERSION}" ${{ matrix.artifact }}.tar.gz --clobber
