# Build bootstrap sig compiler binaries using cmake + ninja.
# All platforms build natively with their own LLVM package.
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: build-bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap release tag'
        required: false
        default: 'bootstrap-sig-v31'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || 'bootstrap-sig-v31' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            llvm_asset: llvm-22-x86_64-linux-native.tar.xz
            artifact: bootstrap-sig-x86_64-linux
            deps: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zlib1g-dev libzstd-dev
            zig_version: "0.14.1"
          - os: windows-latest
            target: x86_64-windows
            llvm_asset: llvm-22-x86_64-windows-native.tar.xz
            artifact: bootstrap-sig-x86_64-windows
            deps: choco install ninja -y
            zig_version: "0.14.1"
          - os: macos-14
            target: aarch64-macos
            llvm_asset: llvm-22-aarch64-macos-native.tar.xz
            artifact: bootstrap-sig-aarch64-macos
            deps: brew install cmake ninja
            zig_version: "0.14.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        shell: bash
        run: ${{ matrix.deps }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Download pre-built LLVM 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "${{ matrix.llvm_asset }}" --dir /tmp
          mkdir -p "$PWD/llvm-22"
          tar -xJf "/tmp/${{ matrix.llvm_asset }}" -C "$PWD/llvm-22" --strip-components=1
          rm "/tmp/${{ matrix.llvm_asset }}"
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build with cmake + ninja
        shell: bash
        run: |
          export PATH="$PWD/llvm-22/bin:$PATH"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage3" \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_USE_LLVM_CONFIG=ON \
            -DZIG_NO_LIB=ON \
            -DZIG_TARGET_MCPU="baseline" \
            -GNinja
          ninja zig2 -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          file zig2 || file zig2.exe || true

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ matrix.artifact }}/bin
          if [ -f build/zig2.exe ]; then
            cp build/zig2.exe ${{ matrix.artifact }}/bin/sig.exe
            cp build/zig2.exe ${{ matrix.artifact }}/bin/zig.exe
          else
            cp build/zig2 ${{ matrix.artifact }}/bin/sig
            cp build/zig2 ${{ matrix.artifact }}/bin/zig
          fi
          tar -czf ${{ matrix.artifact }}.tar.gz -C ${{ matrix.artifact }} .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" \
              --title "Bootstrap Sig Compiler ${VERSION}" \
              --notes "Native bootstrap sig with LLVM 22. All platforms." \
              --prerelease
          gh release upload "${VERSION}" ${{ matrix.artifact }}.tar.gz --clobber
