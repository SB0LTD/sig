# Build LLVM-enabled bootstrap sig compiler binaries using cmake + ninja.
# Requires: pre-built LLVM 22 from build-llvm.yaml (release tag: llvm-22)
#
# Only Linux and macOS bootstraps are built. Windows release binaries are
# cross-compiled from Linux (no Windows bootstrap needed).
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: build-bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap release tag'
        required: false
        default: 'bootstrap-sig-v13'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || 'bootstrap-sig-v13' }}
  ZIG_VERSION: "0.14.1"

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            llvm_asset: llvm-22-x86_64-linux.tar.xz
            artifact: bootstrap-sig-x86_64-linux
            deps: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zlib1g-dev libzstd-dev clang libc++-dev libc++abi-dev
            zlib_flag: "-DZLIB=$(find /usr/lib/x86_64-linux-gnu -name 'libz.a' 2>/dev/null | head -1)"
            zstd_flag: "-DZSTD=$(find /usr/lib/x86_64-linux-gnu -name 'libzstd.a' 2>/dev/null | head -1)"
          - os: macos-14
            llvm_asset: llvm-22-aarch64-macos.tar.xz
            artifact: bootstrap-sig-aarch64-macos
            deps: brew install cmake ninja zstd
            zlib_flag: ""
            zstd_flag: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        shell: bash
        run: ${{ matrix.deps }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download pre-built LLVM 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "${{ matrix.llvm_asset }}" --dir /tmp
          mkdir -p "$PWD/llvm-22"
          tar -xJf "/tmp/${{ matrix.llvm_asset }}" -C "$PWD/llvm-22" --strip-components=1
          rm "/tmp/${{ matrix.llvm_asset }}"
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build with cmake + ninja
        shell: bash
        run: |
          export PATH="$PWD/llvm-22/bin:$PATH"
          # Use clang/libc++ on Linux to match LLVM libs
          if [ "${{ runner.os }}" = "Linux" ]; then
            export CC=clang CXX=clang++
            LIBCXX_FLAG="-DLLVM_ENABLE_LIBCXX=ON"
          else
            LIBCXX_FLAG=""
          fi
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage3" \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            ${LIBCXX_FLAG} \
            -DZIG_USE_LLVM_CONFIG=ON \
            -DZIG_NO_LIB=ON \
            -DZIG_TARGET_MCPU="baseline" \
            ${{ matrix.zlib_flag }} \
            ${{ matrix.zstd_flag }} \
            -GNinja
          ninja zig2 -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          file zig2 || true

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ matrix.artifact }}/bin
          cp build/zig2 ${{ matrix.artifact }}/bin/sig
          cp build/zig2 ${{ matrix.artifact }}/bin/zig
          tar -czf ${{ matrix.artifact }}.tar.gz -C ${{ matrix.artifact }} .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" \
              --title "Bootstrap Sig Compiler ${VERSION}" \
              --notes "LLVM-enabled bootstrap sig built with cmake+ninja+zig." \
              --prerelease
          gh release upload "${VERSION}" ${{ matrix.artifact }}.tar.gz --clobber
