# Build bootstrap sig compiler binaries natively on each platform.
# Linux: GCC + native LLVM 22. macOS: Apple Clang + native LLVM 22. Windows: MSVC + native LLVM 22.
# Each platform uses its native toolchain for best compatibility.
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: build-bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bootstrap release tag'
        required: false
        default: 'bootstrap-sig-v31'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || 'bootstrap-sig-v31' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zlib1g-dev libzstd-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Download LLVM 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "llvm-22-x86_64-linux-native.tar.xz" --dir /tmp
          mkdir -p llvm-22
          tar -xJf /tmp/llvm-22-x86_64-linux-native.tar.xz -C llvm-22 --strip-components=1
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build with cmake
        run: |
          export PATH="$PWD/llvm-22/bin:$PATH"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_USE_LLVM_CONFIG=ON \
            -DZIG_NO_LIB=ON \
            -DZIG_TARGET_MCPU=baseline \
            -GNinja
          ninja zig2 -j$(nproc)
          file zig2

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/bin
          cp build/zig2 out/bin/sig
          cp build/zig2 out/bin/zig
          tar -czf bootstrap-sig-x86_64-linux.tar.gz -C out .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --title "Bootstrap ${VERSION}" --notes "Native bootstrap sig." --prerelease
          gh release upload "${VERSION}" bootstrap-sig-x86_64-linux.tar.gz --clobber

  build-macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: brew install cmake ninja

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Download LLVM 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try zstd first (faster decompression), fall back to xz
          if gh release download llvm-22 --pattern "llvm-22-aarch64-macos-native.tar.zst" --dir /tmp 2>/dev/null; then
            mkdir -p llvm-22
            zstd -d /tmp/llvm-22-aarch64-macos-native.tar.zst --stdout | tar -x -C llvm-22 --strip-components=1
          else
            gh release download llvm-22 --pattern "llvm-22-aarch64-macos-native.tar.xz" --dir /tmp
            mkdir -p llvm-22
            tar -xJf /tmp/llvm-22-aarch64-macos-native.tar.xz -C llvm-22 --strip-components=1
          fi
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build with cmake
        run: |
          export PATH="$PWD/llvm-22/bin:$PATH"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZIG_USE_LLVM_CONFIG=ON \
            -DZIG_NO_LIB=ON \
            -DZIG_TARGET_MCPU=baseline \
            -GNinja
          ninja zig2 -j$(sysctl -n hw.ncpu)
          file zig2

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/bin
          cp build/zig2 out/bin/sig
          cp build/zig2 out/bin/zig
          tar -czf bootstrap-sig-aarch64-macos.tar.gz -C out .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --title "Bootstrap ${VERSION}" --notes "Native bootstrap sig." --prerelease
          gh release upload "${VERSION}" bootstrap-sig-aarch64-macos.tar.gz --clobber

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Download LLVM 22
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try zstd format first (faster), fall back to xz
          $zst = "llvm-22-x86_64-windows-native.tar.zst"
          $xz = "llvm-22-x86_64-windows-native.tar.xz"
          gh release download llvm-22 --pattern $zst --dir $env:TEMP 2>$null
          if (Test-Path "$env:TEMP\$zst") {
            mkdir llvm-22
            zstd -d "$env:TEMP\$zst" --stdout | tar -x -C llvm-22 --strip-components=1
          } else {
            gh release download llvm-22 --pattern $xz --dir $env:TEMP
            mkdir llvm-22
            tar -xJf "$env:TEMP\$xz" -C llvm-22 --strip-components=1
          }
          echo "LLVM_PREFIX=$PWD\llvm-22" >> $env:GITHUB_ENV

      - name: Build with cmake + MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\llvm-22\bin;%PATH%
          mkdir build
          cd build
          cmake .. -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_PREFIX_PATH=%LLVM_PREFIX% -DCMAKE_BUILD_TYPE=Release -DZIG_USE_LLVM_CONFIG=ON -DZIG_NO_LIB=ON -DZIG_TARGET_MCPU=baseline -GNinja
          ninja zig2 -j%NUMBER_OF_PROCESSORS%

      - name: Verify
        shell: cmd
        run: build\zig2.exe version

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/bin
          cp build/zig2.exe out/bin/sig.exe
          cp build/zig2.exe out/bin/zig.exe
          tar -czf bootstrap-sig-x86_64-windows.tar.gz -C out .
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --title "Bootstrap ${VERSION}" --notes "Native bootstrap sig." --prerelease
          gh release upload "${VERSION}" bootstrap-sig-x86_64-windows.tar.gz --clobber
