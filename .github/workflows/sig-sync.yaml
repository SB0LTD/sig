name: sig-sync

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # poll every 30 min

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://codeberg.org/ziglang/zig.git 2>/dev/null || true
          git fetch upstream master

      - name: Enumerate new commits
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/master)

          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream ($UPSTREAM)"
            exit 0
          fi

          # List every upstream commit we haven't integrated, oldest first
          git rev-list HEAD..upstream/master --reverse > /tmp/new_commits.txt
          COUNT=$(wc -l < /tmp/new_commits.txt)
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "$COUNT new upstream commits to integrate"

      # ── Per-commit rebase loop ──────────────────────────────────────
      - name: Integrate commits one-by-one
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "sig-sync[bot]"
          git config user.email "sig-sync@users.noreply.github.com"

          SIG_SPECIFIC_PATHS=(
            README.md CHANGELOG.md build.sig
            "lib/sig/" "tools/sig_sync/" "tools/setup-sig/"
            "tools/upstream-watcher/" ".github/workflows/"
          )
          UPSTREAM_COMPILER_PATHS=(
            src/Sema.zig src/print_zir.zig
            lib/std/zig/Zir.zig lib/std/zig/AstGen.zig
            lib/std/zig/AstRlAnnotate.zig lib/std/zig/BuiltinFn.zig
          )

          TOTAL=$(wc -l < /tmp/new_commits.txt)
          IDX=0

          while IFS= read -r COMMIT; do
            IDX=$((IDX + 1))
            SHORT=$(git rev-parse --short=7 "$COMMIT")
            SUBJECT=$(git log -1 --format='%s' "$COMMIT")
            echo "::group::[$IDX/$TOTAL] $SHORT — $SUBJECT"

            # ── Try cherry-pick (rebase-style) first ──────────────────
            INTEGRATED=false
            if git cherry-pick "$COMMIT" --no-edit 2>/dev/null; then
              echo "Clean cherry-pick"
              INTEGRATED=true
            else
              # Check if there are conflicts
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -z "$CONFLICTS" ]; then
                # cherry-pick failed for non-conflict reason — fall back to merge
                git cherry-pick --abort 2>/dev/null || true
              else
                echo "Cherry-pick conflicts detected, attempting auto-resolve..."

                # For sig-specific files, keep ours
                for f in "${SIG_SPECIFIC_PATHS[@]}"; do
                  git checkout --ours -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
                done

                # For upstream compiler files, take theirs
                for f in "${UPSTREAM_COMPILER_PATHS[@]}"; do
                  if echo "$CONFLICTS" | grep -q "^$f$"; then
                    git checkout --theirs -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
                  fi
                done

                # Check if all conflicts resolved
                REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                if [ -z "$REMAINING" ]; then
                  git -c core.editor=true cherry-pick --continue
                  echo "Cherry-pick with auto-resolved conflicts"
                  INTEGRATED=true
                else
                  echo "::warning::Cannot auto-resolve cherry-pick for $SHORT, falling back to merge"
                  git cherry-pick --abort 2>/dev/null || true
                fi
              fi
            fi

            # ── Fallback: merge single commit ─────────────────────────
            if [ "$INTEGRATED" = "false" ]; then
              if git merge "$COMMIT" --no-edit -m "sig-sync: merge upstream $SHORT — $SUBJECT"; then
                echo "Clean merge (fallback)"
                INTEGRATED=true
              else
                # Same conflict resolution for merge
                for f in "${SIG_SPECIFIC_PATHS[@]}"; do
                  git checkout --ours -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
                done
                for f in "${UPSTREAM_COMPILER_PATHS[@]}"; do
                  if git diff --name-only --diff-filter=U | grep -q "^$f$"; then
                    git checkout --theirs -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
                  fi
                done

                REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                if [ -z "$REMAINING" ]; then
                  git commit --no-edit -m "sig-sync: merge upstream $SHORT (conflicts auto-resolved)"
                  echo "Merge with auto-resolved conflicts"
                  INTEGRATED=true
                else
                  echo "::error::Unresolved conflicts for $SHORT:"
                  echo "$REMAINING"
                  git merge --abort 2>/dev/null || true
                  echo "Stopping integration at commit $SHORT"
                  break
                fi
              fi
            fi

            # ── Sync zig version from CMakeLists.txt → build.sig ──────
            if [ "$INTEGRATED" = "true" ]; then
              ZIG_MAJOR=$(sed -n 's/^set(ZIG_VERSION_MAJOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_MINOR=$(sed -n 's/^set(ZIG_VERSION_MINOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_PATCH=$(sed -n 's/^set(ZIG_VERSION_PATCH \([0-9]*\))/\1/p' CMakeLists.txt)

              if [ -n "$ZIG_MAJOR" ] && [ -n "$ZIG_MINOR" ] && [ -n "$ZIG_PATCH" ]; then
                # Read current values from build.sig
                CUR_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
                CUR_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
                CUR_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)

                if [ "$ZIG_MAJOR" != "$CUR_MAJOR" ] || [ "$ZIG_MINOR" != "$CUR_MINOR" ] || [ "$ZIG_PATCH" != "$CUR_PATCH" ]; then
                  echo "Updating zig_version in build.sig: $CUR_MAJOR.$CUR_MINOR.$CUR_PATCH → $ZIG_MAJOR.$ZIG_MINOR.$ZIG_PATCH"
                  sed -i "s/const zig_version: std.SemanticVersion = .{ .major = [0-9]*, .minor = [0-9]*, .patch = [0-9]* };/const zig_version: std.SemanticVersion = .{ .major = $ZIG_MAJOR, .minor = $ZIG_MINOR, .patch = $ZIG_PATCH };/" build.sig
                  git add build.sig
                  git diff --cached --quiet || git commit -m "sig-sync: bump zig_version to $ZIG_MAJOR.$ZIG_MINOR.$ZIG_PATCH"
                fi
              fi

              # ── Update manifest ───────────────────────────────────────
              TIMESTAMP=$(date +%s)
              python3 -c "
          import json, os
          m = {'last_integrated_commit': '$COMMIT', 'last_integration_timestamp': $TIMESTAMP, 'entries': []}
          os.makedirs('tools/sig_sync', exist_ok=True)
          with open('tools/sig_sync/manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
              f.write('\n')
          "
              git add tools/sig_sync/manifest.json
              git diff --cached --quiet || git commit -m "sig-sync: update manifest to $SHORT"

              # ── Push + release for this commit ────────────────────────
              git push origin HEAD:master

              echo "Dispatching sig-release for $SHORT..."
              gh api repos/${{ github.repository }}/dispatches \
                -f event_type=sig-release

              # Small delay so the release workflow picks up the right HEAD
              sleep 5
            fi

            echo "::endgroup::"
          done < /tmp/new_commits.txt
