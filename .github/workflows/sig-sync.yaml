name: sig-sync

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://codeberg.org/ziglang/zig.git 2>/dev/null || true
          git fetch upstream master

      - name: Enumerate new commits
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/master)

          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream ($UPSTREAM)"
            exit 0
          fi

          git rev-list HEAD..upstream/master --reverse > /tmp/new_commits.txt
          COUNT=$(wc -l < /tmp/new_commits.txt)
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "$COUNT new upstream commits to integrate"

      - name: Integrate commits one-by-one
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "sig-sync[bot]"
          git config user.email "sig-sync@users.noreply.github.com"

          # Files we own — on conflict, keep ours
          SIG_OWNED=(
            README.md CHANGELOG.md build.sig
            stage1/config.zig.in
          )
          # Directories we own — on conflict, keep ours
          SIG_OWNED_DIRS=(
            lib/sig/ tools/sig_sync/ tools/sig_sync_watcher/
            tools/setup-sig/ tools/upstream-watcher/ .github/workflows/
          )

          resolve_conflicts() {
            local CONFLICTS
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            [ -z "$CONFLICTS" ] && return 0

            echo "Resolving $(echo "$CONFLICTS" | wc -l) conflicted files..."

            while IFS= read -r f; do
              local keep_ours=false

              # Check if file is sig-owned
              for owned in "${SIG_OWNED[@]}"; do
                [ "$f" = "$owned" ] && keep_ours=true && break
              done
              if [ "$keep_ours" = "false" ]; then
                for dir in "${SIG_OWNED_DIRS[@]}"; do
                  [[ "$f" == ${dir}* ]] && keep_ours=true && break
                done
              fi

              if [ "$keep_ours" = "true" ]; then
                echo "  keep ours: $f"
                git checkout --ours -- "$f" && git add "$f"
              else
                echo "  take theirs: $f"
                git checkout --theirs -- "$f" && git add "$f"
              fi
            done <<< "$CONFLICTS"

            # Verify all resolved
            REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            [ -z "$REMAINING" ] && return 0
            echo "::error::Still unresolved: $REMAINING"
            return 1
          }

          TOTAL=$(wc -l < /tmp/new_commits.txt)
          IDX=0

          while IFS= read -r COMMIT; do
            IDX=$((IDX + 1))
            SHORT=$(git rev-parse --short=7 "$COMMIT")
            SUBJECT=$(git log -1 --format='%s' "$COMMIT")
            echo "::group::[$IDX/$TOTAL] $SHORT — $SUBJECT"

            INTEGRATED=false

            # ── Try cherry-pick first ─────────────────────────────────
            if git cherry-pick "$COMMIT" --no-edit 2>/dev/null; then
              echo "Clean cherry-pick"
              INTEGRATED=true
            else
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONFLICTS" ]; then
                if resolve_conflicts; then
                  git -c core.editor=true cherry-pick --continue
                  echo "Cherry-pick with auto-resolved conflicts"
                  INTEGRATED=true
                else
                  git cherry-pick --abort 2>/dev/null || true
                fi
              else
                git cherry-pick --abort 2>/dev/null || true
              fi
            fi

            # ── Fallback: merge ───────────────────────────────────────
            if [ "$INTEGRATED" = "false" ]; then
              if git merge "$COMMIT" --no-edit -m "sig-sync: merge upstream $SHORT — $SUBJECT" 2>/dev/null; then
                echo "Clean merge (fallback)"
                INTEGRATED=true
              else
                if resolve_conflicts; then
                  git commit --no-edit -m "sig-sync: merge upstream $SHORT (auto-resolved)"
                  echo "Merge with auto-resolved conflicts"
                  INTEGRATED=true
                else
                  git merge --abort 2>/dev/null || true
                  echo "::error::Cannot integrate $SHORT — manual resolution needed"
                  break
                fi
              fi
            fi

            # ── Post-integration: version sync, manifest, README, push, release
            if [ "$INTEGRATED" = "true" ]; then
              # Sync zig version from CMakeLists.txt → build.sig
              ZIG_MAJOR=$(sed -n 's/^set(ZIG_VERSION_MAJOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_MINOR=$(sed -n 's/^set(ZIG_VERSION_MINOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_PATCH=$(sed -n 's/^set(ZIG_VERSION_PATCH \([0-9]*\))/\1/p' CMakeLists.txt)

              if [ -n "$ZIG_MAJOR" ] && [ -n "$ZIG_MINOR" ] && [ -n "$ZIG_PATCH" ]; then
                CUR_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
                CUR_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
                CUR_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)

                if [ "$ZIG_MAJOR" != "$CUR_MAJOR" ] || [ "$ZIG_MINOR" != "$CUR_MINOR" ] || [ "$ZIG_PATCH" != "$CUR_PATCH" ]; then
                  sed -i "s/const zig_version: std.SemanticVersion = .{ .major = [0-9]*, .minor = [0-9]*, .patch = [0-9]* };/const zig_version: std.SemanticVersion = .{ .major = $ZIG_MAJOR, .minor = $ZIG_MINOR, .patch = $ZIG_PATCH };/" build.sig
                  git add build.sig
                  git diff --cached --quiet || git commit -m "sig-sync: bump zig_version to $ZIG_MAJOR.$ZIG_MINOR.$ZIG_PATCH"
                fi
              fi

              # Update manifest
              TIMESTAMP=$(date +%s)
              python3 -c "
          import json, os
          m = {'last_integrated_commit': '$COMMIT', 'last_integration_timestamp': $TIMESTAMP, 'entries': []}
          os.makedirs('tools/sig_sync', exist_ok=True)
          with open('tools/sig_sync/manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
              f.write('\n')
          "
              git add tools/sig_sync/manifest.json
              git diff --cached --quiet || git commit -m "sig-sync: update manifest to $SHORT"

              # Update README sync status
              SYNC_DATE=$(date -u +%Y-%m-%d)
              ZIG_VER="${ZIG_MAJOR:-0}.${ZIG_MINOR:-17}.${ZIG_PATCH:-0}"
              python3 << PYEOF
          import re
          commit = "$COMMIT"
          short = commit[:8]
          date = "$SYNC_DATE"
          zig = "$ZIG_VER"
          with open('README.md', 'r') as f: content = f.read()
          content = re.sub(r'\| \*\*Latest upstream commit\*\* \|[^|]*\|', f'| **Latest upstream commit** | [\`{short}\`](https://codeberg.org/ziglang/zig/commit/{commit}) |', content)
          content = re.sub(r'\| \*\*Last sync\*\* \|[^|]*\|', f'| **Last sync** | {date} |', content)
          content = re.sub(r'\| \*\*Base version\*\* \|[^|]*\|', f'| **Base version** | zig {zig}-dev · LLVM 22.1.3 |', content)
          with open('README.md', 'w') as f: f.write(content)
          PYEOF
              git add README.md
              git diff --cached --quiet || git commit -m "sig-sync: update README sync status"

              # Push + trigger release
              git push origin HEAD:master

              echo "Dispatching sig-release for $SHORT..."
              gh api repos/${{ github.repository }}/dispatches \
                -f event_type=sig-release

              sleep 5
            fi

            echo "::endgroup::"
          done < /tmp/new_commits.txt
