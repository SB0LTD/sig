name: sig-sync

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://codeberg.org/ziglang/zig.git 2>/dev/null || true
          git fetch upstream master --depth=100

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/master)
          # Check if upstream/master is already an ancestor of HEAD
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream ($UPSTREAM)"
          else
            COUNT=$(git rev-list HEAD..upstream/master --count)
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "UPSTREAM_SHA=$UPSTREAM" >> "$GITHUB_ENV"
            echo "COMMIT_COUNT=$COUNT" >> "$GITHUB_ENV"
            echo "$COUNT new upstream commits (latest: $UPSTREAM)"
          fi

      - name: Merge upstream
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "sig-sync[bot]"
          git config user.email "sig-sync@users.noreply.github.com"

          # Try automatic merge
          if git merge upstream/master --no-edit -m "sig-sync: merge upstream zig ($COMMIT_COUNT commits)"; then
            echo "MERGE_OK=true" >> "$GITHUB_ENV"
            echo "Clean merge"
          else
            echo "MERGE_OK=false" >> "$GITHUB_ENV"
            echo "::warning::Merge conflicts detected"

            # For sig-specific files, keep ours
            for f in README.md CHANGELOG.md build.sig lib/sig/ tools/sig_sync/ tools/setup-sig/ tools/upstream-watcher/ .github/workflows/; do
              git checkout --ours -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
            done

            # For upstream compiler files, take theirs
            for f in src/Sema.zig src/print_zir.zig lib/std/zig/Zir.zig lib/std/zig/AstGen.zig lib/std/zig/AstRlAnnotate.zig lib/std/zig/BuiltinFn.zig; do
              if git diff --name-only --diff-filter=U | grep -q "^$f$"; then
                git checkout --theirs -- "$f" 2>/dev/null && git add "$f" 2>/dev/null || true
              fi
            done

            # Check if all conflicts are resolved
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit -m "sig-sync: merge upstream zig ($COMMIT_COUNT commits, conflicts auto-resolved)"
            echo "MERGE_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Update manifest
        if: steps.check.outputs.skip != 'true' && env.MERGE_OK == 'true'
        run: |
          TIMESTAMP=$(date +%s)
          cat > tools/sig_sync/manifest.json << EOF
          {
            "last_integrated_commit": "$UPSTREAM_SHA",
            "last_integration_timestamp": $TIMESTAMP,
            "entries": []
          }
          EOF
          # Fix indentation from heredoc
          python3 -c "
          import json
          with open('tools/sig_sync/manifest.json') as f:
              d = json.load(f)
          with open('tools/sig_sync/manifest.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          "
          git add tools/sig_sync/manifest.json
          git diff --cached --quiet || git commit -m "sig-sync: update manifest to $UPSTREAM_SHA"

      - name: Push
        if: steps.check.outputs.skip != 'true' && env.MERGE_OK == 'true'
        run: git push origin HEAD:master
