name: sig-sync

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:

concurrency:
  group: sig-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repository_dispatch records the SHA at dispatch time. A serialized
          # run may start much later, so resolve the branch tip when it starts
          # instead of replaying commits already integrated by the prior run.
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          # [sig] Codeberg frequently returns HTTP 504 from GitHub Actions runners
          # (large repo + cloud IP rate limiting). Use aggressive retry with shallow
          # fetch to reduce payload, then deepen only if needed.
          git remote add upstream https://codeberg.org/ziglang/zig.git 2>/dev/null || true

          # Configure git for better network resilience
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          fetch_upstream() {
            local max_attempts=5
            local delay=15

            for attempt in $(seq 1 $max_attempts); do
              echo "Fetching upstream (attempt $attempt/$max_attempts)..."
              if git fetch upstream master --depth=1 2>&1; then
                # Deepen enough to find merge-base with our HEAD
                echo "Shallow fetch OK, deepening for merge-base..."
                git fetch upstream master --deepen=500 2>/dev/null || true
                return 0
              fi
              echo "::warning::Fetch attempt $attempt failed"
              [ $attempt -lt $max_attempts ] && sleep $delay && delay=$((delay * 2))
            done
            return 1
          }

          if ! fetch_upstream; then
            echo "::error::Failed to fetch from codeberg after 5 attempts"
            exit 1
          fi

      - name: Enumerate new commits
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/master)

          if git merge-base --is-ancestor "$UPSTREAM" HEAD 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream ($UPSTREAM)"
            exit 0
          fi

          # [sig] If merge-base fails (shallow clone), deepen further
          if ! git merge-base HEAD upstream/master >/dev/null 2>&1; then
            echo "Shallow history insufficient, fetching full history..."
            git fetch upstream master --unshallow 2>/dev/null || git fetch upstream master 2>/dev/null || true
          fi

          git rev-list HEAD..upstream/master --reverse > /tmp/new_commits.txt
          COUNT=$(wc -l < /tmp/new_commits.txt)
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "$COUNT new upstream commits to integrate"

      - name: Integrate commits one-by-one
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "sig-sync[bot]"
          git config user.email "sig-sync@users.noreply.github.com"

          # ── Resolve current bootstrap tag from manifest ─────────────
          BOOTSTRAP_TAG="bootstrap-sig-v42"
          if [ -f tools/sig_sync/manifest.json ]; then
            MANIFEST_BOOT=$(python3 -c "
          import json
          with open('tools/sig_sync/manifest.json') as f:
              m = json.load(f)
          print(m.get('bootstrap_tag', ''))" 2>/dev/null || true)
            [ -n "$MANIFEST_BOOT" ] && BOOTSTRAP_TAG="$MANIFEST_BOOT"
          fi
          echo "Current bootstrap: $BOOTSTRAP_TAG"

          # Files we own — on conflict, keep ours
          SIG_OWNED=(
            README.md CHANGELOG.md build.sig build.zig build_wasm.zig
            stage1/config.zig.in
            .gitignore bootstrap.ps1 CMakeLists.txt
          )
          # Directories we own — on conflict, keep ours
          SIG_OWNED_DIRS=(
            lib/sig/ tools/sig_sync/ tools/sig_sync_watcher/
            tools/setup-sig/ tools/upstream-watcher/ .github/workflows/
          )

          resolve_conflicts() {
            local CONFLICTS
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            [ -z "$CONFLICTS" ] && return 0

            echo "Resolving $(echo "$CONFLICTS" | wc -l) conflicted files..."

            while IFS= read -r f; do
              local keep_ours=false

              # Check if file is sig-owned
              for owned in "${SIG_OWNED[@]}"; do
                [ "$f" = "$owned" ] && keep_ours=true && break
              done
              if [ "$keep_ours" = "false" ]; then
                for dir in "${SIG_OWNED_DIRS[@]}"; do
                  [[ "$f" == ${dir}* ]] && keep_ours=true && break
                done
              fi

              if [ "$keep_ours" = "true" ]; then
                echo "  keep ours: $f"
                git checkout --ours -- "$f" && git add "$f"
              else
                echo "  take theirs: $f"
                git checkout --theirs -- "$f" && git add "$f"
              fi
            done <<< "$CONFLICTS"

            # Verify all resolved
            REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            [ -z "$REMAINING" ] && return 0
            echo "::error::Still unresolved: $REMAINING"
            return 1
          }

          # ── Bootstrap validation helper ─────────────────────────────
          # Downloads the bootstrap compiler and tries a minimal build
          # to detect lib incompatibilities (e.g. deleted musl sources).
          # Returns 0 if bootstrap is good, 1 if rebuild needed.
          validate_bootstrap() {
            local TAG="$1"
            echo "Validating bootstrap $TAG..."

            # Download bootstrap
            local TMPBOOT=$(mktemp -d)
            if ! gh release download "$TAG" \
                --pattern "bootstrap-sig-x86_64-linux.tar.zst" \
                --pattern "bootstrap-sig-x86_64-linux.tar.zst.sha256" \
                --dir "$TMPBOOT" 2>/dev/null; then
              echo "::warning::Bootstrap $TAG not found"
              return 1
            fi
            (cd "$TMPBOOT" && sha256sum --check --strict bootstrap-sig-x86_64-linux.tar.zst.sha256) || {
              echo "::warning::Bootstrap $TAG digest mismatch"
              rm -rf "$TMPBOOT"
              return 1
            }
            mkdir -p "$TMPBOOT/boot"
            zstd -d "$TMPBOOT/bootstrap-sig-x86_64-linux.tar.zst" --stdout | tar -x -C "$TMPBOOT/boot"

            local SIG_BIN=$(find "$TMPBOOT/boot" -type f \( -name "sig" -o -name "zig" \) | head -1)
            [ -z "$SIG_BIN" ] && echo "::warning::No binary in bootstrap" && rm -rf "$TMPBOOT" && return 1
            chmod +x "$SIG_BIN"

            # Try a minimal musl libc compilation probe — this catches stale
            # musl sources (e.g. deleted .c files the compiler recipe still references).
            # We use build-obj with a trivial zig file that links libc, which forces
            # the compiler to build musl from source. No @cImport (needs LLVM).
            cat > "$TMPBOOT/probe.zig" << 'PROBE'
          extern "c" fn getenv(name: [*:0]const u8) ?[*:0]u8;
          pub fn main() void { _ = getenv("HOME"); }
          PROBE

            local RESULT=0
            if ! "$SIG_BIN" build-exe "$TMPBOOT/probe.zig" \
                --zig-lib-dir "$(pwd)/lib" \
                -target x86_64-linux-musl -lc \
                --name probe \
                -fno-emit-bin 2>"$TMPBOOT/probe.log"; then
              echo "Bootstrap probe (build-exe) failed:"
              cat "$TMPBOOT/probe.log"
              if grep -q "FileNotFound\|file_hash\|sub-compilation.*failed" "$TMPBOOT/probe.log"; then
                echo "::warning::Bootstrap $TAG has stale lib references — rebuild needed"
                RESULT=1
              else
                echo "::warning::Bootstrap probe failed — rebuild required"
                cat "$TMPBOOT/probe.log"
                RESULT=1
              fi
            else
              echo "Bootstrap $TAG build-exe probe OK"
            fi

            # Also probe 'zig build --help' which exercises lib/compiler/ build runner
            if [ "$RESULT" = "0" ]; then
              if ! "$SIG_BIN" build \
                  "--zig-lib=$(pwd)/lib" \
                  --help 2>"$TMPBOOT/build_probe.log"; then
                echo "Bootstrap probe (zig build) failed:"
                cat "$TMPBOOT/build_probe.log"
                if grep -q "FileNotFound\|file_hash" "$TMPBOOT/build_probe.log"; then
                  echo "::warning::Bootstrap $TAG can't run 'zig build' — rebuild needed"
                  RESULT=1
                fi
              else
                echo "Bootstrap $TAG zig-build probe OK"
              fi
            fi

            rm -rf "$TMPBOOT"
            return $RESULT
          }

          # ── Pre-flight: validate current bootstrap ──────────────────
          NEED_REBUILD=false

          TOTAL=$(wc -l < /tmp/new_commits.txt)
          IDX=0

          while IFS= read -r COMMIT; do
            IDX=$((IDX + 1))
            SHORT=$(git rev-parse --short=7 "$COMMIT")
            SUBJECT=$(git log -1 --format='%s' "$COMMIT")
            echo "::group::[$IDX/$TOTAL] $SHORT — $SUBJECT"

            INTEGRATED=false

            # ── Try cherry-pick first ─────────────────────────────────
            if git cherry-pick "$COMMIT" --no-edit 2>/dev/null; then
              echo "Clean cherry-pick"
              INTEGRATED=true
            else
              CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONFLICTS" ]; then
                if resolve_conflicts; then
                  # Check if resolution resulted in an empty commit (all changes were in owned files)
                  if git diff --cached --quiet 2>/dev/null; then
                    echo "Cherry-pick empty after conflict resolution — skipping"
                    git cherry-pick --skip 2>/dev/null || true
                    INTEGRATED=true
                  else
                    git -c core.editor=true cherry-pick --continue
                    echo "Cherry-pick with auto-resolved conflicts"
                    INTEGRATED=true
                  fi
                else
                  git cherry-pick --abort 2>/dev/null || true
                fi
              else
                git cherry-pick --abort 2>/dev/null || true
              fi
            fi

            # ── Fallback: merge ───────────────────────────────────────
            if [ "$INTEGRATED" = "false" ]; then
              if git merge "$COMMIT" --no-edit -m "sig-sync: merge upstream $SHORT — $SUBJECT" 2>/dev/null; then
                echo "Clean merge (fallback)"
                INTEGRATED=true
              else
                if resolve_conflicts; then
                  # Check if resolution resulted in an empty commit
                  if git diff --cached --quiet 2>/dev/null; then
                    echo "Merge empty after conflict resolution — skipping"
                    git merge --abort 2>/dev/null || true
                    INTEGRATED=true
                  else
                    git commit --no-edit -m "sig-sync: merge upstream $SHORT (auto-resolved)"
                    echo "Merge with auto-resolved conflicts"
                    INTEGRATED=true
                  fi
                else
                  git merge --abort 2>/dev/null || true
                  echo "::error::Cannot integrate $SHORT — manual resolution needed"
                  break
                fi
              fi
            fi

            # ── Post-integration: version sync, manifest, README, push
            if [ "$INTEGRATED" = "true" ]; then
              # Sync Zig compatibility version from CMakeLists.txt into both
              # Sig build frontends. build.sig remains the release authority,
              # and release preflight rejects any divergence between the two.
              ZIG_MAJOR=$(sed -n 's/^set(ZIG_VERSION_MAJOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_MINOR=$(sed -n 's/^set(ZIG_VERSION_MINOR \([0-9]*\))/\1/p' CMakeLists.txt)
              ZIG_PATCH=$(sed -n 's/^set(ZIG_VERSION_PATCH \([0-9]*\))/\1/p' CMakeLists.txt)

              if [ -n "$ZIG_MAJOR" ] && [ -n "$ZIG_MINOR" ] && [ -n "$ZIG_PATCH" ]; then
                for build_file in build.sig build.zig; do
                  sed -i "s/const zig_version: std.SemanticVersion = .{ .major = [0-9]*, .minor = [0-9]*, .patch = [0-9]* };/const zig_version: std.SemanticVersion = .{ .major = $ZIG_MAJOR, .minor = $ZIG_MINOR, .patch = $ZIG_PATCH };/" "$build_file"
                done
                git add build.sig build.zig
                git diff --cached --quiet || git commit -m "sig-sync: bump zig_version to $ZIG_MAJOR.$ZIG_MINOR.$ZIG_PATCH"
              fi

              # ── Check if this commit touches lib/ in ways that break bootstrap ──
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
              TOUCHES_LIB=false
              if echo "$CHANGED_FILES" | grep -qE '^lib/(libc|std|compiler_rt|compiler)/'; then
                TOUCHES_LIB=true
              fi

              # Check if this commit touches stage1/ or compiler internals that
              # could require zig1.wasm regeneration (stage1 compiler snapshot).
              # Signals: stage1/ changes, Zir/AstGen/Parse changes, struct layout changes.
              NEEDS_ZIG1_REGEN=false
              if echo "$CHANGED_FILES" | grep -qE '^stage1/'; then
                NEEDS_ZIG1_REGEN=true
                echo "::warning::Commit touches stage1/ — zig1.wasm needs regeneration"
              elif echo "$CHANGED_FILES" | grep -qE '^(lib/std/zig/(Zir|AstGen|Parse|tokenizer)\.zig|src/(Air|Sema|Zcu|InternPool|codegen|Type|Value)\.zig)'; then
                NEEDS_ZIG1_REGEN=true
                echo "::warning::Commit touches compiler internals — zig1.wasm needs regeneration"
              fi

              # If this commit touches lib/ and we haven't validated yet, do it now
              if [ "$TOUCHES_LIB" = "true" ] && [ "$NEED_REBUILD" = "false" ]; then
                echo "Commit touches lib/ — validating bootstrap..."
                if ! validate_bootstrap "$BOOTSTRAP_TAG"; then
                  NEED_REBUILD=true
                  echo "::warning::Bootstrap stale after $SHORT — will regen + rebuild after sync"
                fi
              fi

              # If stage1 files changed, trigger zig1.wasm regeneration after all
              # commits are integrated (it needs the latest source to compile against)
              if [ "$NEEDS_ZIG1_REGEN" = "true" ]; then
                echo "ZIG1_REGEN_NEEDED=true" >> /tmp/sync_state.env
              fi

              # Update manifest (now includes bootstrap_tag)
              TIMESTAMP=$(date +%s)
              python3 -c "
          import json, os
          m = {
            'last_integrated_commit': '$COMMIT',
            'last_integration_timestamp': $TIMESTAMP,
            'bootstrap_tag': '$BOOTSTRAP_TAG',
            'entries': []
          }
          os.makedirs('tools/sig_sync', exist_ok=True)
          with open('tools/sig_sync/manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
              f.write('\n')
          "
              git add tools/sig_sync/manifest.json
              git diff --cached --quiet || git commit -m "sig-sync: update manifest to $SHORT"

              # Update README sync status
              SYNC_DATE=$(date -u +%Y-%m-%d)
              ZIG_VER="${ZIG_MAJOR:-0}.${ZIG_MINOR:-17}.${ZIG_PATCH:-0}"
              python3 << PYEOF
          import re
          commit = "$COMMIT"
          short = commit[:8]
          date = "$SYNC_DATE"
          zig = "$ZIG_VER"
          with open('README.md', 'r') as f: content = f.read()
          content = re.sub(r'\| \*\*Latest upstream commit\*\* \|[^|]*\|', f'| **Latest upstream commit** | [\`{short}\`](https://codeberg.org/ziglang/zig/commit/{commit}) |', content)
          content = re.sub(r'\| \*\*Last sync\*\* \|[^|]*\|', f'| **Last sync** | {date} |', content)
          content = re.sub(r'\| \*\*Base version\*\* \|[^|]*\|', f'| **Base version** | zig {zig}-dev · LLVM 22.1.7 |', content)
          with open('README.md', 'w') as f: f.write(content)
          PYEOF
              git add README.md
              git diff --cached --quiet || git commit -m "sig-sync: update README sync status"

              # Push this commit
              git push origin HEAD:master

              sleep 2
            fi

            echo "::endgroup::"
          done < /tmp/new_commits.txt

          # ── Regenerate zig1.wasm if compiler internals changed ──────
          REGEN_NEEDED=false
          if grep -q "ZIG1_REGEN_NEEDED=true" /tmp/sync_state.env 2>/dev/null; then
            REGEN_NEEDED=true
          fi

          # Also check if bootstrap validation failed (NEED_REBUILD was set in the loop)
          if [ "$NEED_REBUILD" = "true" ]; then
            REGEN_NEEDED=true
          fi

          if [ "$REGEN_NEEDED" = "true" ]; then
            echo "::notice::Triggering zig1.wasm regeneration + bootstrap rebuild chain..."
            PREVIOUS_REGEN_ID=$(gh run list \
              --workflow="regen-zig1-wasm.yaml" \
              --event workflow_dispatch \
              --branch master \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
            gh workflow run regen-zig1-wasm.yaml -f bootstrap_tag="$BOOTSTRAP_TAG"

            # Wait for zig1.wasm regen to complete (max 2h)
            echo "Waiting for zig1.wasm regeneration..."
            MAX_WAIT=7200
            WAITED=0
            POLL=60
            REGEN_OK=false
            REGEN_RUN_ID=""
            while [ $WAITED -lt $MAX_WAIT ]; do
              sleep $POLL
              WAITED=$((WAITED + POLL))
              if [ -z "$REGEN_RUN_ID" ]; then
                CANDIDATE_ID=$(gh run list \
                  --workflow="regen-zig1-wasm.yaml" \
                  --event workflow_dispatch \
                  --branch master \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
                if [ "$CANDIDATE_ID" != 0 ] && [ "$CANDIDATE_ID" != "$PREVIOUS_REGEN_ID" ]; then
                  REGEN_RUN_ID="$CANDIDATE_ID"
                  echo "Tracking zig1.wasm workflow run $REGEN_RUN_ID"
                fi
              fi
              if [ -n "$REGEN_RUN_ID" ]; then
                REGEN_STATUS=$(gh run view "$REGEN_RUN_ID" --json conclusion --jq '.conclusion // ""' 2>/dev/null || true)
              else
                REGEN_STATUS=""
              fi
              if [ "$REGEN_STATUS" = "success" ]; then
                echo "zig1.wasm regeneration complete (waited ${WAITED}s)"
                REGEN_OK=true
                break
              elif [ "$REGEN_STATUS" = "failure" ]; then
                echo "::error::zig1.wasm regeneration failed"
                break
              fi
              echo "  Still waiting for zig1.wasm regen... (${WAITED}s)"
            done

            if [ "$REGEN_OK" != "true" ]; then
              echo "::error::zig1.wasm regeneration did not complete successfully"
              exit 1
            fi

            # Pull the exact regenerated zig1.wasm commit before bootstrapping.
            git pull --rebase origin master

            # Bump bootstrap version and rebuild.
            VER_NUM=$(echo "$BOOTSTRAP_TAG" | grep -oP 'v\K[0-9]+')
            NEW_VER=$((VER_NUM + 1))
            NEW_TAG="bootstrap-sig-v${NEW_VER}"
            echo "::notice::Rebuilding bootstrap: $BOOTSTRAP_TAG → $NEW_TAG"
            gh workflow run build-bootstrap.yaml \
              -f version="$NEW_TAG" \
              -f llvm_tag=llvm-22.1.7-sig-0.3.0.r2

            # The draft is published only after all four platform probes and
            # the aggregate manifest pass. A Linux asset alone is insufficient.
            echo "Waiting for published bootstrap $NEW_TAG..."
            MAX_WAIT=10800
            WAITED=0
            BOOT_OK=false
            while [ $WAITED -lt $MAX_WAIT ]; do
              sleep $POLL
              WAITED=$((WAITED + POLL))
              RELEASE_JSON=$(gh release view "$NEW_TAG" --json isDraft,assets 2>/dev/null || true)
              if [ -n "$RELEASE_JSON" ] && jq -e \
                  '.isDraft == false and ([.assets[].name] | index("bootstrap-build-manifest.json") != null)' \
                  <<<"$RELEASE_JSON" >/dev/null; then
                if validate_bootstrap "$NEW_TAG"; then
                  echo "Bootstrap $NEW_TAG fully published and validated (waited ${WAITED}s)"
                  BOOT_OK=true
                  break
                fi
                echo "::error::Published bootstrap $NEW_TAG failed its consumer probe"
                exit 1
              fi
              echo "  Still waiting for complete bootstrap... (${WAITED}s)"
            done

            if [ "$BOOT_OK" != "true" ]; then
              echo "::error::Bootstrap build timed out or failed; refusing stale release"
              exit 1
            fi

            BOOTSTRAP_TAG="$NEW_TAG"
            # Update manifest only after the immutable set is fully published.
            python3 -c "
          import json
          with open('tools/sig_sync/manifest.json') as f: m = json.load(f)
          m['bootstrap_tag'] = '$NEW_TAG'
          with open('tools/sig_sync/manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
              f.write('\n')
          "
            git add tools/sig_sync/manifest.json
            git diff --cached --quiet || git commit -m "sig-sync: bump bootstrap to $NEW_TAG"
            git push origin HEAD:master
          fi

          # ── Dispatch release ────────────────────────────────────────
          echo "Dispatching sig-release with bootstrap=$BOOTSTRAP_TAG..."
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=sig-release \
            -f "client_payload[bootstrap_tag]=$BOOTSTRAP_TAG" \
            -f "client_payload[llvm_tag]=llvm-22.1.7-sig-0.3.0.r2"
