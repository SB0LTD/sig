# Prove both sides of a bootstrap transition: the published package remains a
# compatible compiler/library/build-runner unit, and that verified compiler can
# execute the current checkout's native runner before a replacement bootstrap
# exists. Final bootstrap packaging performs the full package-level target test.
name: test-build-runner

on:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: 'Published bootstrap release to verify'
        required: true
        default: 'bootstrap-sig-v49'

permissions:
  contents: read

concurrency:
  group: test-build-runner-${{ inputs.bootstrap_tag }}
  cancel-in-progress: false

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install extraction tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Download and verify packaged bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive=bootstrap-sig-x86_64-linux.tar.zst
          mkdir -p /tmp/bootstrap-download /tmp/bootstrap-package
          gh release download "${BOOTSTRAP_TAG}" \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir /tmp/bootstrap-download
          (cd /tmp/bootstrap-download && sha256sum --check --strict "$archive.sha256")
          zstd -d "/tmp/bootstrap-download/$archive" --stdout | \
            tar -x -C /tmp/bootstrap-package
          package=/tmp/bootstrap-package/bootstrap-sig-x86_64-linux
          test -x "$package/bin/sig"
          test -f "$package/lib/compiler/Maker.zig"
          test -f "$package/tools/sig_build/main.sig"
          echo "SIG=$package/bin/sig" >> "$GITHUB_ENV"
          echo "PACKAGE_ZIG_LIB_DIR=$package/lib" >> "$GITHUB_ENV"

      - name: Prove packaged compatibility and current native runner
        shell: bash
        run: |
          set -euo pipefail
          "$SIG" version | grep -q '^sig '
          PROVE_CROSS_TARGET=0 \
            bash ci/prove-native-build.sh "$SIG" "$PACKAGE_ZIG_LIB_DIR"
          export ZIG_LIB_DIR="$GITHUB_WORKSPACE/lib"
          bash ci/prove-native-build.sh "$SIG" "$ZIG_LIB_DIR"
          "$SIG" ast-check compiler/test_all.sig
          "$SIG" build \
            -Dno-lib \
            -Dno-langref \
            -Dno-bin \
            --summary all
