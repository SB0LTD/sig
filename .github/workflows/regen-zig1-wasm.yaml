name: update-zig1-wasm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bootstrap sig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download bootstrap-sig-v7 --pattern "bootstrap-sig-x86_64-linux.tar.gz" --dir /tmp
          mkdir -p /tmp/bootstrap
          tar -xzf /tmp/bootstrap-sig-x86_64-linux.tar.gz -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "zig" -o -name "zig2" \) | head -1)
          chmod +x "$BIN"
          echo "SIG=$BIN" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname $BIN)/../lib" 2>/dev/null || true

      - name: Create build_options.zig
        run: |
          printf '%s\n' \
            'pub const have_llvm = false;' \
            'pub const llvm_has_m68k = false;' \
            'pub const llvm_has_csky = false;' \
            'pub const llvm_has_arc = false;' \
            'pub const llvm_has_xtensa = false;' \
            'pub const version: [:0]const u8 = "0.16.0-dev";' \
            'pub const semver = @import("std").SemanticVersion.parse(version) catch unreachable;' \
            'pub const enable_debug_extensions = false;' \
            'pub const enable_logging = false;' \
            'pub const enable_link_snapshots = false;' \
            'pub const enable_tracy = false;' \
            'pub const value_tracing = false;' \
            'pub const skip_non_native = false;' \
            'pub const debug_gpa = false;' \
            'pub const dev = .bootstrap;' \
            'pub const io_mode: enum { threaded, evented } = .threaded;' \
            'pub const value_interpret_mode = .by_name;' \
            'pub const sig_version: [:0]const u8 = "0.1.2";' \
            'pub const mem_leak_frames = 0;' \
            > /tmp/build_options.zig

      - name: Regenerate zig1.wasm
        env:
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-wasm-cache
          ZIG_LOCAL_CACHE_DIR: /tmp/zig-wasm-local
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || true

          # Free disk space for swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /

          # 20GB swap — self-hosted wasm codegen is extremely memory-hungry
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory: $(free -h | grep Mem | awk '{print $2}') RAM + $(free -h | grep Swap | awk '{print $2}') swap"

          rm -rf /tmp/zig-wasm-cache /tmp/zig-wasm-local
          mkdir -p /tmp/zig-wasm-cache /tmp/zig-wasm-local
          rm -f stage1/zig1.wasm

          echo "Building zig1.wasm (self-hosted wasm backend)..."
          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=/tmp/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            -O ReleaseSmall \
            -femit-bin="stage1/zig1.wasm" \
            --zig-lib-dir lib \
            -target wasm32-wasi \
            -fno-llvm \
            -fno-lld \
            -fstrip \
            -fsingle-threaded \
            -lc

          ls -la stage1/zig1.wasm
          file stage1/zig1.wasm
          MAGIC=$(xxd -l 4 -p stage1/zig1.wasm)
          if [ "$MAGIC" != "0061736d" ]; then
            echo "FATAL: not a wasm file (magic=$MAGIC)"
            exit 1
          fi
          echo "OK: valid wasm — $(du -h stage1/zig1.wasm | cut -f1)"

      - name: Commit
        run: |
          SIZE_MB=$(du -m stage1/zig1.wasm | cut -f1)
          echo "zig1.wasm: ${SIZE_MB}MB"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$SIZE_MB" -gt 90 ]; then
            git lfs install
            git lfs track "stage1/zig1.wasm"
            git add .gitattributes
          fi

          git add stage1/zig1.wasm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate zig1.wasm (${SIZE_MB}MB)"
          git push
