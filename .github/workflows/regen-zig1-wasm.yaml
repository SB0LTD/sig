name: update-zig1-wasm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtain a working compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Strategy: try bootstrap sig first, fall back to upstream zig release.
          # The bootstrap can become stale when upstream makes breaking changes
          # to compiler internals (ZIR, AstGen, etc.) that zig1.wasm doesn't understand.

          USE_UPSTREAM=false

          # Read bootstrap tag from manifest
          BOOT_TAG="bootstrap-sig-v10"
          if [ -f tools/sig_sync/manifest.json ]; then
            MANIFEST_BOOT=$(python3 -c "
          import json
          with open('tools/sig_sync/manifest.json') as f:
              m = json.load(f)
          print(m.get('bootstrap_tag', ''))" 2>/dev/null || true)
            [ -n "$MANIFEST_BOOT" ] && BOOT_TAG="$MANIFEST_BOOT"
          fi
          echo "Trying bootstrap: $BOOT_TAG"

          # Try downloading bootstrap
          if gh release download "$BOOT_TAG" --pattern "bootstrap-sig-x86_64-linux.tar.gz" --dir /tmp 2>/dev/null; then
            mkdir -p /tmp/bootstrap
            tar -xzf /tmp/bootstrap-sig-x86_64-linux.tar.gz -C /tmp/bootstrap
            BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "zig" -o -name "zig2" \) | head -1)
            chmod +x "$BIN"

            # Quick probe: can the bootstrap compile a trivial file with current lib?
            cat > /tmp/probe.zig << 'PROBE'
          pub fn main() void {}
          PROBE
            if "$BIN" build-exe /tmp/probe.zig --zig-lib-dir lib -target x86_64-linux -fno-emit-bin 2>/tmp/probe.log; then
              echo "Bootstrap $BOOT_TAG works"
              echo "SIG=$BIN" >> "$GITHUB_ENV"
            else
              echo "::warning::Bootstrap $BOOT_TAG is stale:"
              cat /tmp/probe.log
              USE_UPSTREAM=true
            fi
          else
            echo "::warning::Bootstrap $BOOT_TAG not found"
            USE_UPSTREAM=true
          fi

          # Fallback: download upstream zig dev build (same 0.17.0-dev series)
          if [ "$USE_UPSTREAM" = "true" ]; then
            echo "Falling back to upstream zig dev build..."

            # Fetch the latest dev build URL from ziglang.org/download/index.json
            ZIG_INDEX=$(curl -sSL "https://ziglang.org/download/index.json")
            ZIG_URL=$(echo "$ZIG_INDEX" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          master = data.get('master', {})
          linux = master.get('x86_64-linux', {})
          print(linux.get('tarball', ''))" 2>/dev/null || true)

            if [ -z "$ZIG_URL" ]; then
              # Hardcoded fallback
              ZIG_URL="https://ziglang.org/builds/zig-x86_64-linux-0.17.0-dev.314+eae06cf5c.tar.xz"
            fi

            echo "Downloading upstream zig from: $ZIG_URL"
            curl -sSL "$ZIG_URL" -o /tmp/zig-upstream.tar.xz

            mkdir -p /tmp/zig-upstream
            tar -xJf /tmp/zig-upstream.tar.xz -C /tmp/zig-upstream --strip-components=1
            BIN="/tmp/zig-upstream/zig"
            chmod +x "$BIN"

            # Verify it works
            if "$BIN" version; then
              echo "Using upstream zig: $("$BIN" version)"
              echo "SIG=$BIN" >> "$GITHUB_ENV"
            else
              echo "::error::Upstream zig binary doesn't work either"
              exit 1
            fi
          fi

      - name: Regenerate zig1.wasm via build system
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || true

          # Free disk space and add swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory: $(free -h | grep Mem | awk '{print $2}') RAM + $(free -h | grep Swap | awk '{print $2}') swap"

          rm -f stage1/zig1.wasm
          rm -rf .zig-cache ~/.cache/zig zig-out zig-cache

          # Generate build_options for wasm bootstrap
          mkdir -p .build-gen
          cat > .build-gen/build_options.zig << 'EOF'
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 0;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .by_name;
          pub const version: [:0]const u8 = "0.17.0";
          pub const sig_version: [:0]const u8 = "0.2.0";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .bootstrap;
          EOF

          echo "Building zig1.wasm via build-exe..."
          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name zig1 \
            -target wasm32-wasi \
            -OReleaseSmall \
            -fsingle-threaded \
            --zig-lib-dir lib \
            --cache-dir .zig-cache \
            -femit-bin=stage1/zig1.wasm

          ls -la stage1/zig1.wasm
          file stage1/zig1.wasm
          MAGIC=$(xxd -l 4 -p stage1/zig1.wasm)
          if [ "$MAGIC" != "0061736d" ]; then
            echo "FATAL: not a wasm file (magic=$MAGIC)"
            exit 1
          fi
          echo "OK: valid wasm — $(du -h stage1/zig1.wasm | cut -f1)"

      - name: Commit
        run: |
          SIZE_MB=$(du -m stage1/zig1.wasm | cut -f1)
          echo "zig1.wasm: ${SIZE_MB}MB"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$SIZE_MB" -gt 90 ]; then
            git lfs install
            git lfs track "stage1/zig1.wasm"
            git add .gitattributes
          fi

          git add stage1/zig1.wasm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate zig1.wasm (${SIZE_MB}MB)"
          git push
