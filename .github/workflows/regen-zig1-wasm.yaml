name: update-zig1-wasm

on:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: 'Verified Sig bootstrap release tag'
        required: true
        default: 'bootstrap-sig-v43'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Obtain the verified Sig bootstrap compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd

          release_json=$(gh release view "$BOOTSTRAP_TAG" --json isDraft,assets)
          jq -e '.isDraft == false' <<<"$release_json" >/dev/null
          mkdir -p /tmp/sig-bootstrap/extracted

          zstd_archive=bootstrap-sig-x86_64-linux.tar.zst
          legacy_archive=bootstrap-sig-x86_64-linux.tar.gz
          if jq -e --arg archive "$zstd_archive" \
              '[.assets[].name] | index($archive) != null and index($archive + ".sha256") != null' \
              <<<"$release_json" >/dev/null; then
            gh release download "$BOOTSTRAP_TAG" \
              --pattern "$zstd_archive" \
              --pattern "$zstd_archive.sha256" \
              --dir /tmp/sig-bootstrap
            (cd /tmp/sig-bootstrap && sha256sum --check --strict "$zstd_archive.sha256")
            zstd -d "/tmp/sig-bootstrap/$zstd_archive" --stdout |
              tar -x -C /tmp/sig-bootstrap/extracted
          elif jq -e --arg archive "$legacy_archive" \
              '[.assets[].name] | index($archive) != null' \
              <<<"$release_json" >/dev/null; then
            # v41 predates sidecar checksums. GitHub records the immutable asset
            # digest, so verify that digest before using it as the one-time
            # bridge into the strict v42 package format.
            expected=$(jq -er --arg archive "$legacy_archive" \
              '.assets[] | select(.name == $archive) | .digest | select(startswith("sha256:")) | sub("^sha256:"; "")' \
              <<<"$release_json")
            gh release download "$BOOTSTRAP_TAG" \
              --pattern "$legacy_archive" \
              --dir /tmp/sig-bootstrap
            actual=$(sha256sum "/tmp/sig-bootstrap/$legacy_archive" | cut -d' ' -f1)
            test "$actual" = "$expected"
            tar -xzf "/tmp/sig-bootstrap/$legacy_archive" \
              -C /tmp/sig-bootstrap/extracted
          else
            echo "::error::Bootstrap $BOOTSTRAP_TAG has no verified x86_64 Linux archive"
            exit 1
          fi

          BIN=$(find /tmp/sig-bootstrap/extracted -type f -path '*/bin/sig' -print -quit)
          test -n "$BIN"
          chmod +x "$BIN"
          version_output=$("$BIN" version)
          if [[ "$version_output" != *"sig "* && ! "$version_output" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "::error::Bootstrap returned an invalid version identity: $version_output"
            exit 1
          fi
          echo "SIG=$BIN" >> "$GITHUB_ENV"

      - name: Regenerate zig1.wasm via build system
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || true

          # Free disk space and add swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory: $(free -h | grep Mem | awk '{print $2}') RAM + $(free -h | grep Swap | awk '{print $2}') swap"

          rm -f stage1/zig1.wasm
          rm -rf .zig-cache ~/.cache/zig zig-out zig-cache

          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          ZIG_VER=$(sed -n 's/^const zig_version:.*major = \([0-9]*\), \.minor = \([0-9]*\), \.patch = \([0-9]*\).*/\1.\2.\3/p' build.sig | head -1)
          test -n "$SIG_VER"
          test -n "$ZIG_VER"

          echo "Building zig1.wasm via build system..."
          # Use zig build with build_wasm.zig — the build system properly resolves
          # wasm32-wasi target (build-exe ignores -target for the linker).
          # Maker requires --zig-lib= as its first argument. This binds the
          # bootstrap executable to this exact checkout's matching library.
          "${SIG}" build \
            --zig-lib=lib \
            --build-file build_wasm.zig \
            -Dsig-version="$SIG_VER" \
            -Dzig-version="$ZIG_VER" \
            update-zig1

          ls -la stage1/zig1.wasm
          file stage1/zig1.wasm
          MAGIC=$(xxd -l 4 -p stage1/zig1.wasm)
          if [ "$MAGIC" != "0061736d" ]; then
            echo "FATAL: not a wasm file (magic=$MAGIC)"
            exit 1
          fi
          chmod 0644 stage1/zig1.wasm
          echo "OK: valid wasm — $(du -h stage1/zig1.wasm | cut -f1)"

      - name: Commit
        run: |
          SIZE_MB=$(du -m stage1/zig1.wasm | cut -f1)
          echo "zig1.wasm: ${SIZE_MB}MB"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$SIZE_MB" -gt 90 ]; then
            git lfs install
            git lfs track "stage1/zig1.wasm"
            git add .gitattributes
          fi

          git add stage1/zig1.wasm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate zig1.wasm (${SIZE_MB}MB)"
          git push
