# Transitional no-LLVM release — produces bootstrap binary with compiler module wiring
name: release-nollvm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
      bootstrap_tag:
        description: 'Bootstrap release tag'
        required: false
        default: 'bootstrap-sig-v44'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag || 'bootstrap-sig-v44' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            bin: sig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "invalid release tag" >&2; exit 2; }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; transitional tags are immutable" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Download bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1 zstd
          gh release download "${{ env.BOOTSTRAP_TAG }}" \
            --pattern bootstrap-sig-x86_64-linux.tar.zst \
            --pattern bootstrap-sig-x86_64-linux.tar.zst.sha256 \
            --dir /tmp
          (cd /tmp && sha256sum --check --strict bootstrap-sig-x86_64-linux.tar.zst.sha256)
          mkdir -p /tmp/bootstrap
          zstd -d /tmp/bootstrap-sig-x86_64-linux.tar.zst --stdout | tar -x -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f -name "sig" | head -1)
          chmod +x "$BIN"
          echo "SIG=${BIN}" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname "$(dirname "$BIN")")/lib"
          "${BIN}" version || true

      - name: Build (no-LLVM, direct build-exe)
        run: |
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          mkdir -p .build-gen stage3-out/bin

          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${SIG_VER}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseFast \
            -fstrip \
            --zig-lib-dir lib \
            -target x86_64-linux-musl \
            --cache-dir .zig-cache \
            -femit-bin=stage3-out/bin/sig

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive=bootstrap-sig-x86_64-linux.tar.zst
          mkdir -p bootstrap-out/bin bootstrap-out/tools
          cp stage3-out/bin/sig bootstrap-out/bin/sig
          cp stage3-out/bin/sig bootstrap-out/bin/zig
          cp -R lib bootstrap-out/lib
          cp tools/sig_build/main.zig bootstrap-out/tools/sig_build.zig
          tar -cf - -C bootstrap-out . | zstd -19 -T0 -o "$archive"
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check --strict "$archive.sha256"

          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Bootstrap ${VERSION}" \
            --notes "No-LLVM transitional bootstrap with compiler module wiring. Not a production Sig toolchain." \
            --draft \
            --prerelease
          gh release upload "${VERSION}" "$archive" "$archive.sha256"
          expected="$(awk '{print $1}' "$archive.sha256")"
          actual="$(gh release view "${VERSION}" --json assets --jq ".assets[] | select(.name == \"$archive\") | .digest")"
          test "$actual" = "sha256:$expected"
          gh release edit "${VERSION}" --draft=false --prerelease
