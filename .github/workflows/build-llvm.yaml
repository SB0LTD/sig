# [sig] Build LLVM 22 from source for all platforms.
# Cross-compiled targets use zig cc from Linux. Native targets build on their own runner.
# One-time setup — re-run only when upgrading LLVM version.
name: build-llvm

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which targets to build (all, native-only, cross-only)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - native-only
          - cross-only

permissions:
  contents: write

env:
  LLVM_TAG: "llvmorg-22.1.7"
  RELEASE_TAG: "llvm-22"
  ZIG_VERSION: "0.17.0-dev.389+f5a1968f6"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            artifact: llvm-22-x86_64-linux-native.tar.xz
          - target: x86_64-linux-musl
            artifact: llvm-22-x86_64-linux.tar.xz
          - target: aarch64-macos-none
            artifact: llvm-22-aarch64-macos.tar.xz
          - target: x86_64-windows-gnu
            artifact: llvm-22-x86_64-windows.tar.xz
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build python3 zlib1g-dev libzstd-dev

      - name: Setup Zig
        if: matrix.target != 'native'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_TAG }} https://github.com/llvm/llvm-project.git llvm-src

      - name: Determine cmake system name
        if: matrix.target != 'native'
        id: cmake-sys
        run: |
          case "${{ matrix.target }}" in
            *linux*)  echo "name=Linux" >> "$GITHUB_OUTPUT" ;;
            *macos*)  echo "name=Darwin" >> "$GITHUB_OUTPUT" ;;
            *windows*) echo "name=Windows" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create zig cc wrappers
        if: matrix.target != 'native'
        run: |
          cat > /tmp/zig-cc << EOF
          #!/bin/bash
          exec zig cc -target ${{ matrix.target }} "\$@"
          EOF
          cat > /tmp/zig-cxx << EOF
          #!/bin/bash
          exec zig c++ -target ${{ matrix.target }} "\$@"
          EOF
          cat > /tmp/zig-ar << 'EOF'
          #!/bin/bash
          exec zig ar "$@"
          EOF
          cat > /tmp/zig-ranlib << 'EOF'
          #!/bin/bash
          exec zig ranlib "$@"
          EOF
          chmod +x /tmp/zig-cc /tmp/zig-cxx /tmp/zig-ar /tmp/zig-ranlib

      - name: Cross-compile zlib
        if: matrix.target != 'native'
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          mkdir zlib-build && cd zlib-build
          for f in ../zlib-src/adler32.c ../zlib-src/compress.c ../zlib-src/crc32.c ../zlib-src/deflate.c ../zlib-src/infback.c ../zlib-src/inffast.c ../zlib-src/inflate.c ../zlib-src/inftrees.c ../zlib-src/trees.c ../zlib-src/uncompr.c ../zlib-src/zutil.c; do
            zig cc -target ${{ matrix.target }} -O2 -fPIC -c "$f"
          done
          zig ar rcs libz.a *.o *.obj 2>/dev/null || zig ar rcs libz.a *.o || zig ar rcs libz.a *.obj
          cd ..
          mkdir -p zlib-out/lib zlib-out/include
          cp zlib-build/libz.a zlib-out/lib/
          cp zlib-src/zlib.h zlib-src/zconf.h zlib-out/include/
          echo "ZLIB_PREFIX=$PWD/zlib-out" >> "$GITHUB_ENV"

      - name: Cross-compile zstd
        if: matrix.target != 'native'
        run: |
          git clone --depth 1 --branch v1.5.6 https://github.com/facebook/zstd.git zstd-src
          cmake -S zstd-src/build/cmake -B zstd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/zstd-out" \
            -DCMAKE_SYSTEM_NAME=${{ steps.cmake-sys.outputs.name }} \
            -DCMAKE_C_COMPILER=/tmp/zig-cc \
            -DCMAKE_CXX_COMPILER=/tmp/zig-cxx \
            -DCMAKE_AR=/tmp/zig-ar \
            -DCMAKE_RANLIB=/tmp/zig-ranlib \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_MULTITHREAD_SUPPORT=OFF
          ninja -C zstd-build install
          echo "ZSTD_PREFIX=$PWD/zstd-out" >> "$GITHUB_ENV"

      - name: Build LLVM (cross-compile)
        if: matrix.target != 'native'
        run: |
          cmake -S llvm-src/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install" \
            -DCMAKE_SYSTEM_NAME=${{ steps.cmake-sys.outputs.name }} \
            -DCMAKE_C_COMPILER=/tmp/zig-cc \
            -DCMAKE_CXX_COMPILER=/tmp/zig-cxx \
            -DCMAKE_AR=/tmp/zig-ar \
            -DCMAKE_RANLIB=/tmp/zig-ranlib \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SPIRV;SystemZ;VE;WebAssembly;X86;XCore" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="ARC;CSKY;M68k;Xtensa" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=FORCE_ON \
            -DLLVM_ENABLE_ZSTD=FORCE_ON \
            -DLLVM_USE_STATIC_ZSTD=ON \
            -DZLIB_LIBRARY="${ZLIB_PREFIX}/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="${ZLIB_PREFIX}/include" \
            -Dzstd_LIBRARY="${ZSTD_PREFIX}/lib/libzstd.a" \
            -Dzstd_INCLUDE_DIR="${ZSTD_PREFIX}/include" \
            -DLLVM_ENABLE_THREADS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_TOOL_LTO_BUILD=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            -DLLD_BUILD_TOOLS=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DCLANG_PLUGIN_SUPPORT=OFF \
            -DLLVM_TOOL_CLANG_SHLIB_BUILD=OFF \
            -DCLANG_ENABLE_CLANG_DYLIB=OFF \
            -DLLVM_TOOL_LIBCLANG_BUILD=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_HOST_TRIPLE="${{ matrix.target }}" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="${{ matrix.target }}"
          # Build all static libraries first (this avoids triggering shared lib linking)
          ninja -C llvm-build \
            $(ninja -C llvm-build -t targets all | grep -E '^lib/lib(clang|lld|LLVM).*\.a:' | cut -d: -f1 | tr '\n' ' ') \
            -j$(nproc)
          # Install LLVM headers and libs
          ninja -C llvm-build \
            install-llvm-libraries \
            install-lld-libraries \
            install-llvm-headers \
            install-clang-headers \
            install-lld-headers \
            -j$(nproc)
          # Copy ALL static libs from build dir into install prefix
          find llvm-build/lib -name '*.a' -exec cp -n {} "$PWD/llvm-install/lib/" \;
        timeout-minutes: 300

      - name: Build LLVM (native)
        if: matrix.target == 'native'
        run: |
          cmake -S llvm-src/llvm -B llvm-build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SPIRV;SystemZ;VE;WebAssembly;X86;XCore" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="ARC;CSKY;M68k;Xtensa" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=FORCE_ON \
            -DLLVM_ENABLE_ZSTD=FORCE_ON \
            -DLLVM_USE_STATIC_ZSTD=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF
          ninja -C llvm-build install -j$(nproc)
        timeout-minutes: 180

      - name: Include zlib/zstd in package
        if: matrix.target != 'native'
        run: |
          cp "${ZLIB_PREFIX}/lib/libz.a" llvm-install/lib/
          cp "${ZSTD_PREFIX}/lib/libzstd.a" llvm-install/lib/

      - name: Package
        run: tar -cJf "${{ matrix.artifact }}" llvm-install/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_TAG }}" \
              --title "LLVM 22 (build artifacts)" \
              --notes "Pre-built LLVM 22.1.6 with Clang + LLD. Cross-compiled for all targets using zig cc 0.17.0-dev." \
              --prerelease
          gh release upload "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" --clobber

  # Native LLVM builds on Windows and macOS (for bootstrap compilation)
  build-native-platform:
    if: inputs.targets != 'cross-only'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: llvm-22-x86_64-windows-native.tar.zst
            cmake_extra: ""
          - os: macos-14
            artifact: llvm-22-aarch64-macos-native.tar.zst
            cmake_extra: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja zlib zstd

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ninja -y

      - name: Clone LLVM
        shell: bash
        run: git clone --depth 1 --branch ${{ env.LLVM_TAG }} https://github.com/llvm/llvm-project.git llvm-src

      - name: Build LLVM natively
        shell: bash
        run: |
          cmake -S llvm-src/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SPIRV;SystemZ;VE;WebAssembly;X86;XCore" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="ARC;CSKY;M68k;Xtensa" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            ${{ matrix.cmake_extra }}
          ninja -C llvm-build install -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Package
        shell: bash
        run: |
          # Use zstd for native platform packages (10x faster decompression than xz)
          tar -cf - llvm-install/ | zstd -19 -T0 -o "${{ matrix.artifact }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_TAG }}" \
              --title "LLVM 22 (build artifacts)" \
              --notes "Pre-built LLVM 22.1.6 with Clang + LLD." \
              --prerelease
          gh release upload "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" --clobber
