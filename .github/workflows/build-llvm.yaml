# [sig] Build LLVM 22 from source for all platforms and upload as reusable artifacts.
# One-time setup — re-run only when upgrading LLVM version.
name: build-llvm

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_TAG: "llvmorg-22.1.3"
  RELEASE_TAG: "llvm-22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: llvm-22-x86_64-linux.tar.xz
          - os: macos-14
            artifact: llvm-22-aarch64-macos.tar.xz
          - os: ubuntu-latest
            artifact: llvm-22-x86_64-windows.tar.xz
            cross_target: x86_64-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build python3 zlib1g-dev libzstd-dev clang libc++-dev libc++abi-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja zstd

      - name: Setup Zig (for cross-compilation)
        if: matrix.cross_target != ''
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Clone LLVM
        shell: bash
        run: git clone --depth 1 --branch ${{ env.LLVM_TAG }} https://github.com/llvm/llvm-project.git llvm-src

      - name: Build LLVM (native)
        if: matrix.cross_target == ''
        shell: bash
        run: |
          # Use clang with libc++ on Linux so LLVM libs are compatible with -lc++
          if [ "${{ runner.os }}" = "Linux" ]; then
            export CC=clang CXX=clang++
            LIBCXX_FLAG="-DLLVM_ENABLE_LIBCXX=ON"
          else
            LIBCXX_FLAG=""
          fi
          cmake -S llvm-src/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install" \
            ${LIBCXX_FLAG} \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SystemZ;VE;WebAssembly;X86;XCore" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="M68k;Xtensa;ARC;CSKY;SPIRV" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=FORCE_ON \
            -DLLVM_ENABLE_ZSTD=FORCE_ON \
            -DLLVM_USE_STATIC_ZSTD=ON \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF
          ninja -C llvm-build install -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        timeout-minutes: 180

      - name: Build LLVM (cross-compile for Windows)
        if: matrix.cross_target != ''
        shell: bash
        run: |
          # Create zig cc wrapper scripts for cmake
          cat > /tmp/zig-cc << 'EOF'
          #!/bin/bash
          exec zig cc -target x86_64-windows-gnu "$@"
          EOF
          cat > /tmp/zig-cxx << 'EOF'
          #!/bin/bash
          exec zig c++ -target x86_64-windows-gnu "$@"
          EOF
          cat > /tmp/zig-ar << 'EOF'
          #!/bin/bash
          exec zig ar "$@"
          EOF
          cat > /tmp/zig-ranlib << 'EOF'
          #!/bin/bash
          exec zig ranlib "$@"
          EOF
          chmod +x /tmp/zig-cc /tmp/zig-cxx /tmp/zig-ar /tmp/zig-ranlib

          cmake -S llvm-src/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=/tmp/zig-cc \
            -DCMAKE_CXX_COMPILER=/tmp/zig-cxx \
            -DCMAKE_AR=/tmp/zig-ar \
            -DCMAKE_RANLIB=/tmp/zig-ranlib \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SystemZ;VE;WebAssembly;X86;XCore" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="M68k;Xtensa;ARC;CSKY;SPIRV" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_THREADS=ON \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_HOST_TRIPLE=x86_64-windows-gnu \
            -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-windows-gnu
          ninja -C llvm-build install -j$(nproc)
        timeout-minutes: 240

      - name: Package
        shell: bash
        run: tar -cJf "${{ matrix.artifact }}" llvm-install/

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_TAG }}" \
              --title "LLVM 22 (build artifacts)" \
              --notes "Pre-built LLVM 22.1.3 with Clang + LLD. Used as bootstrap dependency for sig releases." \
              --prerelease
          gh release upload "${{ env.RELEASE_TAG }}" "${{ matrix.artifact }}" --clobber
