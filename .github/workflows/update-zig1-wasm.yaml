# Regenerate stage1/zig1.wasm from current source using the bootstrap zig2.
# Run this whenever sig source diverges from the zig1.wasm seed compiler.
name: update-zig1-wasm

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Use the same upstream zig that the bootstrap uses.
  # The cmake bootstrap zig2 cannot cross-compile to wasm (produces native ELF).
  ZIG_VERSION: "0.16.0-dev.3091+557caecaa"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Regenerate zig1.wasm
        env:
          # Don't use setup-zig's cache — it may be poisoned from previous runs
          ZIG_LOCAL_CACHE_DIR: /tmp/zig-cache-local
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-cache-global
        run: |
          ulimit -s unlimited 2>/dev/null || true

          # Remove old file so we can detect if build fails
          rm -f stage1/zig1.wasm
          # Clear any poisoned zig cache
          rm -rf .zig-cache /tmp/zig-cache-local /tmp/zig-cache-global
          mkdir -p /tmp/zig-cache-local /tmp/zig-cache-global

          # Create build_options.zig (normally generated by cmake)
          cat > /tmp/build_options.zig <<'EOF'
          pub const have_llvm = false;
          pub const llvm_has_m68k = false;
          pub const llvm_has_csky = false;
          pub const llvm_has_arc = false;
          pub const llvm_has_xtensa = false;
          pub const version: [:0]const u8 = "0.16.0-dev";
          pub const semver = @import("std").SemanticVersion.parse(version) catch unreachable;
          pub const enable_debug_extensions = false;
          pub const enable_logging = false;
          pub const enable_link_snapshots = false;
          pub const enable_tracy = false;
          pub const value_tracing = false;
          pub const skip_non_native = false;
          pub const debug_gpa = false;
          pub const dev = .bootstrap;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode = .by_name;
          pub const sig_version: [:0]const u8 = "0.1.2";
          pub const mem_leak_frames = 0;
          EOF

          # Debug: show zig version and target support
          zig version
          echo "Building wasm32-wasi target..."

          zig build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=/tmp/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            -O ReleaseSmall \
            -femit-bin="stage1/zig1.wasm" \
            --zig-lib-dir lib \
            -target wasm32-wasi \
            -fstrip \
            -fsingle-threaded

          # Check what was produced
          echo "=== Build output ==="
          ls -la stage1/zig1.wasm || echo "File not created"
          file stage1/zig1.wasm || true
          
          echo "zig1.wasm size: $(du -h stage1/zig1.wasm | cut -f1)"

          # Validate output is actually wasm (magic: \0asm = 00 61 73 6d)
          MAGIC=$(xxd -l 4 -p stage1/zig1.wasm)
          if [ "$MAGIC" != "0061736d" ]; then
            echo "ERROR: zig1.wasm is not a valid wasm file (magic: $MAGIC)"
            file stage1/zig1.wasm || true
            exit 1
          fi
          echo "Validated: zig1.wasm has correct wasm magic bytes"

      - name: Commit to git (with LFS if needed)
        run: |
          SIZE_MB=$(du -m stage1/zig1.wasm | cut -f1)
          echo "zig1.wasm size: ${SIZE_MB}MB"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$SIZE_MB" -gt 90 ]; then
            echo "Setting up Git LFS for large wasm..."
            git lfs install
            git lfs track "stage1/zig1.wasm"
            git add .gitattributes
          fi

          git add stage1/zig1.wasm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate zig1.wasm (${SIZE_MB}MB)"
          git push
