# [sig] Self-sustained release pipeline — sig builds sig
#
# Two-stage build: first produce a native x86_64-linux binary using the v28 bootstrap,
# then use that freshly-built binary to cross-compile for all other targets.
# This mirrors upstream zig-bootstrap's approach.
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v30'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ github.event.client_payload.bootstrap_tag || inputs.bootstrap_tag || 'bootstrap-sig-v30' }}

jobs:
  # Stage 1: Build native x86_64-linux binary using v28 bootstrap
  build-native:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -f "build.sig" ]; then
            VER_FILE="build.sig"
          else
            VER_FILE="build.zig"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/^const sig_version.*major = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_MINOR=$(sed -n 's/^const sig_version.*minor = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_PATCH=$(sed -n 's/^const sig_version.*patch = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_PRE=$(sed -n 's/^const sig_version.*pre = "\([^"]*\)".*/\1/p' "$VER_FILE" | head -1)
            if [ -z "$SIG_MAJOR" ]; then
              SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' "$VER_FILE" | head -1)
            else
              [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                                || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
            fi
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.zig | head -1)
          if [ -z "$ZIG_MAJOR" ] || [ -z "$ZIG_MINOR" ] || [ -z "$ZIG_PATCH" ]; then
            echo "ERROR: failed to extract zig_version from build.zig"
            exit 1
          fi
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} (native x86_64-linux stage)"

      - name: Download bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "bootstrap-sig-x86_64-linux.*" --dir /tmp
          BOOTSTRAP_ARCHIVE=$(ls /tmp/bootstrap-sig-x86_64-linux.* | head -1)
          mkdir -p /tmp/bootstrap
          tar -xf "$BOOTSTRAP_ARCHIVE" -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f -name "sig" | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: sig binary not found in bootstrap archive"
            exit 1
          fi
          chmod +x "$BIN"
          echo "SIG=${BIN}" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname "$(dirname "$BIN")")/lib"
          "${BIN}" version || true

      - name: Download LLVM 22 (x86_64-linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "llvm-22-x86_64-linux.tar.xz" --dir /tmp
          mkdir -p llvm-22
          tar -xJf "/tmp/llvm-22-x86_64-linux.tar.xz" -C llvm-22 --strip-components=1
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build native sig (x86_64-linux-musl)
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          echo "Building x86_64-linux-musl (version: ${ZIG_VER_BASE}, sig: ${SIG_VER})"

          mkdir -p .build-gen stage3-out/bin
          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = true;
          pub const llvm_has_m68k: bool = true;
          pub const llvm_has_csky: bool = true;
          pub const llvm_has_arc: bool = true;
          pub const llvm_has_xtensa: bool = true;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          # Build LLVM link flags from available static libraries
          LLVM_LINK_FLAGS=""
          for lib in "${LLVM_PREFIX}"/lib/lib*.a; do
            name=$(basename "$lib" .a | sed 's/^lib//')
            LLVM_LINK_FLAGS="$LLVM_LINK_FLAGS -l${name}"
          done

          "${SIG}" build-exe \
            -cflags -std=c++17 -fno-exceptions -fno-rtti -fno-stack-protector -DNDEBUG -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS -I${LLVM_PREFIX}/include -isystem lib/libcxx/include -isystem lib/libcxxabi/include -- \
            src/zig_llvm.cpp src/zig_llvm-ar.cpp src/zig_clang_driver.cpp src/zig_clang_cc1_main.cpp src/zig_clang_cc1as_main.cpp \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseFast \
            -fstrip \
            --zig-lib-dir lib \
            -target x86_64-linux-musl \
            --cache-dir .zig-cache \
            -lc \
            -lc++ \
            -L "${LLVM_PREFIX}/lib" \
            $LLVM_LINK_FLAGS \
            -femit-bin=stage3-out/bin/sig

      - name: Verify native binary
        run: |
          chmod +x stage3-out/bin/sig
          ./stage3-out/bin/sig version

      - name: Package native binary
        run: |
          OUT="sig-${VERSION}-x86_64-linux"
          mkdir -p "${OUT}/bin"
          cp stage3-out/bin/sig "${OUT}/bin/sig"
          cp stage3-out/bin/sig "${OUT}/bin/zig"
          cp -r lib "${OUT}/lib"
          echo "Size: $(du -h "${OUT}/bin/sig" | cut -f1)"
          ARCHIVE="sig-${VERSION}-x86_64-linux.tar.xz"
          tar -cJf "${ARCHIVE}" "${OUT}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-x86_64-linux
          path: |
            sig-${{ env.VERSION }}-x86_64-linux.tar.xz
            sig-${{ env.VERSION }}-x86_64-linux.tar.xz.sha256

  # Native builds on Windows and macOS using their own platform bootstraps
  # Each platform has a native sig bootstrap (built via cmake in build-bootstrap.yaml)
  # sig builds sig — bootstrap is sig, output is sig.
  build-platform:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
            bootstrap_asset: bootstrap-sig-x86_64-windows.tar.gz
            ext: zip
            bin: sig.exe
          - os: macos-14
            target: aarch64-macos
            bootstrap_asset: bootstrap-sig-aarch64-macos.tar.gz
            ext: tar.xz
            bin: sig
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "${{ matrix.bootstrap_asset }}" --dir /tmp
          mkdir -p /tmp/bootstrap
          tar -xf "/tmp/${{ matrix.bootstrap_asset }}" -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "sig.exe" \) | head -1)
          chmod +x "$BIN" 2>/dev/null || true
          echo "SIG=${BIN}" >> "$GITHUB_ENV"
          "$BIN" version || true

      - name: Build sig natively
        shell: bash
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          echo "Building ${{ matrix.target }} natively (sig builds sig, no-LLVM)"

          mkdir -p .build-gen stage3-out/bin
          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseSafe \
            --zig-lib-dir lib \
            --cache-dir .zig-cache \
            -femit-bin=stage3-out/bin/${{ matrix.bin }}

      - name: Verify binary
        shell: bash
        run: |
          chmod +x stage3-out/bin/${{ matrix.bin }} 2>/dev/null || true
          file stage3-out/bin/${{ matrix.bin }} || true
          stage3-out/bin/${{ matrix.bin }} version || ./stage3-out/bin/${{ matrix.bin }} version || true

      - name: Package
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          cp "stage3-out/bin/${{ matrix.bin }}" "${OUT}/bin/${{ matrix.bin }}"
          case "${{ matrix.bin }}" in
            sig)     cp "${OUT}/bin/sig" "${OUT}/bin/zig" ;;
            sig.exe) cp "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe" ;;
          esac
          cp -r lib "${OUT}/lib"

      - name: Archive (tar.xz)
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.zip"
          7z a -r "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" 2>/dev/null || certutil -hashfile "${ARCHIVE}" SHA256 > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    needs: [build-native, build-platform]
    if: always() && needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          rm -f sig
          cat *.sha256 > sha256sums.txt 2>/dev/null || true
          PRERELEASE=""
          LATEST_FLAG="--latest"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ] && PRERELEASE="--prerelease" && LATEST_FLAG=""
          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          gh release delete "sig-${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create "sig-${VERSION}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} — self-sustained release (sig builds sig). x86_64-linux with full LLVM 22." \
            ${LATEST_FLAG} ${PRERELEASE} \
            $ARCHIVES sha256sums.txt
