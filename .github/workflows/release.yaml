# [sig] Self-sustained release pipeline — sig builds sig
#
# Linux/macOS: cross-compiled from Linux using Linux bootstrap + Linux LLVM.
# Windows: built natively on Windows using upstream zig (from ziglang.org) as
#   the build compiler, with the Windows LLVM package (built with MSVC /MT).
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v13'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ github.event.client_payload.bootstrap_tag || inputs.bootstrap_tag || 'bootstrap-sig-v13' }}

jobs:
  # ── Linux & macOS ────────────────────────────────────────────────────
  build-unix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            bin: sig
          - target: aarch64-macos
            zig_target: aarch64-macos-none
            ext: tar.xz
            bin: sig
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/^const sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/^const sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/^const sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/^const sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                              || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} for ${{ matrix.target }}"

      - name: Download bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "bootstrap-sig-x86_64-linux.tar.gz" --dir /tmp
          mkdir -p /tmp/bootstrap
          tar -xzf /tmp/bootstrap-sig-x86_64-linux.tar.gz -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "zig" -o -name "zig2" \) | head -1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          echo "BOOTSTRAP_BIN=${BIN}" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname "$(dirname "$BIN")")/lib"
          "${BIN}" version || true

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev libzstd-dev libc++-dev libc++abi-dev

      - name: Download LLVM 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "llvm-22-x86_64-linux.tar.xz" --dir /tmp
          mkdir -p llvm-22
          tar -xJf /tmp/llvm-22-x86_64-linux.tar.xz -C llvm-22 --strip-components=1
          # Ensure static zlib/zstd are in the LLVM lib dir
          cp /usr/lib/x86_64-linux-gnu/libz.a llvm-22/lib/ 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libzstd.a llvm-22/lib/ 2>/dev/null || true
          # Ensure static libc++ is available
          cp /usr/lib/x86_64-linux-gnu/libc++.a llvm-22/lib/ 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libc++abi.a llvm-22/lib/ 2>/dev/null || true
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build stage3
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          echo "Building ${{ matrix.zig_target }} (version: ${ZIG_VER_BASE})"
          "${BOOTSTRAP_BIN}" build \
            --prefix stage3-out \
            -Doptimize=ReleaseFast \
            -Dstrip \
            -Dtarget=${{ matrix.zig_target }} \
            -Dno-lib \
            -Denable-llvm \
            -Dstatic-llvm \
            -Dversion-string="${ZIG_VER_BASE}" \
            --zig-lib-dir lib \
            --search-prefix "${LLVM_PREFIX}"

      - name: Package
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          cp stage3-out/bin/zig "${OUT}/bin/${{ matrix.bin }}"
          cp "${OUT}/bin/${{ matrix.bin }}" "${OUT}/bin/zig"
          cp -r lib "${OUT}/lib"
          echo "Size: $(du -h "${OUT}/bin/${{ matrix.bin }}" | cut -f1)"

      - name: Verify
        run: |
          if [ "${{ matrix.target }}" = "x86_64-linux" ]; then
            chmod +x "sig-${VERSION}-${{ matrix.target }}/bin/sig"
            "./sig-${VERSION}-${{ matrix.target }}/bin/sig" version
          fi

      - name: Archive
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # ── Windows: native build ────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/^const sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/^const sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/^const sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/^const sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                              || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Setup upstream Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Download LLVM 22 (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "llvm-22-x86_64-windows.tar.xz" --dir /tmp
          mkdir -p llvm-22
          tar -xJf /tmp/llvm-22-x86_64-windows.tar.xz -C llvm-22 --strip-components=1
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build stage3 via cmake
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"

          $env:PATH = "$PWD\llvm-22\bin;$env:PATH"
          New-Item -Path 'build' -ItemType Directory | Out-Null
          Set-Location -Path 'build'

          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"

          cmake .. `
            -DCMAKE_INSTALL_PREFIX="$PWD\stage3" `
            -DCMAKE_PREFIX_PATH="$env:LLVM_PREFIX" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DZIG_USE_LLVM_CONFIG=ON `
            -DZIG_STATIC=ON `
            -DZIG_TARGET_MCPU="baseline" `
            -GNinja

          ninja install -j$([Environment]::ProcessorCount)

      - name: Package
        shell: bash
        run: |
          OUT="sig-${VERSION}-x86_64-windows"
          mkdir -p "${OUT}/bin"
          cp build/stage3/bin/zig.exe "${OUT}/bin/sig.exe"
          cp "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe"
          cp -r build/stage3/lib "${OUT}/lib" 2>/dev/null || cp -r lib "${OUT}/lib"
          echo "Size: $(du -h "${OUT}/bin/sig.exe" | cut -f1)"

      - name: Verify
        shell: bash
        run: |
          "./sig-${VERSION}-x86_64-windows/bin/sig.exe" version || true

      - name: Archive
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-x86_64-windows.zip"
          cd "sig-${VERSION}-x86_64-windows" && 7z a -r "../${ARCHIVE}" . && cd ..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-x86_64-windows
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # ── Publish ──────────────────────────────────────────────────────────
  publish:
    needs: [build-unix, build-windows]
    if: always() && needs.build-unix.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-unix.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          cat *.sha256 > sha256sums.txt 2>/dev/null || true
          PRERELEASE=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ] && PRERELEASE="--prerelease"
          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          gh release delete "sig-${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create "sig-${VERSION}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} — self-sustained release." \
            --latest ${PRERELEASE} \
            $ARCHIVES sha256sums.txt
