# [sig] Release pipeline — LLVM-enabled builds via two-stage bootstrap
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-dev)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  LLVM_VERSION: "22"
  LLVM_FULL_VERSION: "22.1.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            runner: ubuntu-latest
          - target: aarch64-linux
            zig_target: aarch64-linux-musl
            ext: tar.xz
            runner: ubuntu-latest
          - target: aarch64-macos
            zig_target: aarch64-macos
            ext: tar.xz
            runner: macos-latest
          - target: x86_64-windows
            zig_target: x86_64-windows
            ext: zip
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/.*sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/.*sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/.*sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/.*sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}+zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # --- Download bootstrap sig from previous release ---
      - name: Download bootstrap sig
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the host architecture for the bootstrap compiler.
          # The bootstrap runs on the *runner*, not the target — e.g. aarch64-linux
          # target runs on ubuntu-latest (x86_64), so we need x86_64-linux sig.
          case "${{ runner.os }}" in
            Linux)   HOST_ARCH="x86_64-linux"  ; ARCHIVE_EXT=".tar.xz" ;;
            macOS)   HOST_ARCH="aarch64-macos"  ; ARCHIVE_EXT=".tar.xz" ;;
            Windows) HOST_ARCH="x86_64-windows" ; ARCHIVE_EXT=".zip"    ;;
            *) echo "ERROR: Unknown runner OS ${{ runner.os }}"; exit 1 ;;
          esac

          # Use gh CLI (authenticated) to avoid GitHub API rate limits
          DOWNLOAD_URL=$(gh api repos/${{ github.repository }}/releases --paginate \
            | python3 -c "
          import sys, json
          host = '${HOST_ARCH}'
          ext  = '${ARCHIVE_EXT}'
          releases = json.load(sys.stdin)
          if not isinstance(releases, list): releases = [releases]
          for r in releases:
            if not isinstance(r, dict): continue
            for a in r.get('assets', []):
              n = a['name']
              if host in n and n.endswith(ext) and 'bootstrap' not in n:
                print(a['browser_download_url'])
                exit(0)
          exit(1)
          ") || {
            echo "ERROR: No sig release found with ${HOST_ARCH} archive."
            echo "Expected asset matching: *${HOST_ARCH}*${ARCHIVE_EXT}"
            echo "Check that a previous sig release exists with binaries for this platform."
            exit 1
          }

          echo "Bootstrap download: $DOWNLOAD_URL"
          mkdir -p /tmp/bootstrap-sig

          if [ "$ARCHIVE_EXT" = ".zip" ]; then
            curl -fsSL "$DOWNLOAD_URL" -o /tmp/bootstrap.zip
            unzip -q /tmp/bootstrap.zip -d /tmp/bootstrap-sig
          else
            curl -fsSL "$DOWNLOAD_URL" -o /tmp/bootstrap.tar.xz
            tar -xJf /tmp/bootstrap.tar.xz -C /tmp/bootstrap-sig
          fi

          SIG=$(find /tmp/bootstrap-sig -type f \( -name "sig" -o -name "sig.exe" \) | head -1)
          [ -z "$SIG" ] && echo "ERROR: sig binary not found in archive" && exit 1
          chmod +x "$SIG"
          # macOS: remove Gatekeeper quarantine attribute
          if [ "${{ runner.os }}" = "macOS" ]; then
            xattr -dr com.apple.quarantine "$SIG" 2>/dev/null || true
          fi
          SIG_DIR=$(dirname "$SIG")
          echo "$SIG_DIR" >> "$GITHUB_PATH"
          # Also export the full path for immediate use in this and subsequent steps
          echo "BOOTSTRAP_SIG=$SIG" >> "$GITHUB_ENV"
          "$SIG" version || true
          echo "ZIG_LIB_DIR=$(pwd)/lib" >> "$GITHUB_ENV"

      # --- Cache (restore before install to avoid redundant downloads) ---
      - name: Cache LLVM packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
            C:/llvm-${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_FULL_VERSION }}-${{ matrix.target }}-${{ runner.os }}
          restore-keys: llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}-

      - name: Cache sig-cache and zigcpp objects
        uses: actions/cache@v4
        with:
          path: |
            .sig-cache
            .sig-cache/zigcpp
          key: sig-cache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: sig-cache-${{ matrix.target }}-

      # --- Install LLVM dev packages (official release archives) ---
      - name: Install LLVM (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          if [ -d "${LLVM_PREFIX}" ] && [ -f "${LLVM_PREFIX}/bin/llvm-config" ]; then
            echo "LLVM ${LLVM_VERSION} already present from cache, skipping install"
          else
            # Use official LLVM release archive (apt.llvm.org ships dev snapshots with different headers)
            ARCHIVE="LLVM-${LLVM_FULL_VERSION}-Linux-X64.tar.xz"
            URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_FULL_VERSION}/${ARCHIVE}"
            echo "Downloading LLVM from ${URL}"
            curl -fsSL "${URL}" -o /tmp/llvm.tar.xz
            sudo mkdir -p "${LLVM_PREFIX}"
            sudo tar -xJf /tmp/llvm.tar.xz -C "${LLVM_PREFIX}" --strip-components=1
            rm /tmp/llvm.tar.xz
            echo "LLVM ${LLVM_FULL_VERSION} installed to ${LLVM_PREFIX}"
            "${LLVM_PREFIX}/bin/llvm-config" --version
          fi

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "/opt/homebrew/opt/llvm@${LLVM_VERSION}" ] && [ -f "/opt/homebrew/opt/llvm@${LLVM_VERSION}/bin/llvm-config" ]; then
            echo "LLVM ${LLVM_VERSION} already present from cache, skipping install"
          else
            brew install llvm@${LLVM_VERSION}
          fi

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          LLVM_DIR="C:/llvm-${LLVM_VERSION}"
          if [ -d "${LLVM_DIR}" ] && [ -f "${LLVM_DIR}/bin/llvm-config.exe" ]; then
            echo "LLVM already present from cache, skipping install"
          else
            # Use clang+llvm archive (includes C++ dev headers, unlike the LLVM-*.exe installer)
            ARCHIVE="clang+llvm-${LLVM_FULL_VERSION}-x86_64-pc-windows-msvc.tar.xz"
            URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_FULL_VERSION}/${ARCHIVE}"
            echo "Downloading LLVM from ${URL}"
            curl -fsSL "${URL}" -o /tmp/llvm.tar.xz
            mkdir -p "${LLVM_DIR}"
            tar -xJf /tmp/llvm.tar.xz -C "${LLVM_DIR}" --strip-components=1
            rm /tmp/llvm.tar.xz
            echo "LLVM ${LLVM_FULL_VERSION} installed to ${LLVM_DIR}"
          fi
          echo "${LLVM_DIR}/bin" >> "$GITHUB_PATH"

      # --- Stage 1: Bootstrap sig without LLVM (sig build-exe) ---
      - name: Write build_options.zig (bootstrap)
        shell: bash
        run: |
          mkdir -p .sig-cache
          cat > .sig-cache/build_options.zig <<'EOF'
          pub const have_llvm = false;
          pub const llvm_has_m68k = false;
          pub const llvm_has_csky = false;
          pub const llvm_has_arc = false;
          pub const llvm_has_xtensa = false;
          pub const version: [:0]const u8 = "0.16.0-dev";
          pub const semver = @import("std").SemanticVersion.parse(version) catch unreachable;
          pub const enable_debug_extensions = false;
          pub const enable_logging = false;
          pub const enable_link_snapshots = false;
          pub const enable_tracy = false;
          pub const value_tracing = false;
          pub const skip_non_native = false;
          pub const debug_gpa = false;
          pub const dev = .full;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode = .direct;
          pub const sig_version: [:0]const u8 = "0.1.2";
          pub const mem_leak_frames = 4;
          EOF

      - name: Bootstrap sig (stage 1 — no LLVM)
        shell: bash
        run: |
          mkdir -p .sig-cache/bootstrap
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"

          # The self-hosted compiler has deep recursion in Sema analysis.
          # Linux/macOS: raise stack limit. Windows: pass --stack flag.
          if [ "${{ runner.os }}" != "Windows" ]; then
            ulimit -s unlimited 2>/dev/null || ulimit -s 65536 2>/dev/null || true
          fi

          STACK_ARG=""
          if [ "${{ matrix.target }}" = "x86_64-windows" ]; then
            STACK_ARG="--stack 134217728"
          fi

          # Use BOOTSTRAP_SIG env var (full path) — more reliable than PATH
          SIG_CMD="${BOOTSTRAP_SIG:-sig}"

          "${SIG_CMD}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.sig-cache/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            -O ReleaseSafe \
            -femit-bin=".sig-cache/bootstrap/${BIN}" \
            --cache-dir .sig-cache \
            --zig-lib-dir lib \
            ${STACK_ARG}
          echo "Bootstrap sig built successfully"
          ls -la ".sig-cache/bootstrap/"
        timeout-minutes: 60

      # --- Stage 2: Rebuild sig with LLVM using bootstrapped sig ---
      - name: Build sig with LLVM (stage 2)
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          BOOTSTRAP=".sig-cache/bootstrap/${BIN}"

          # Determine -Dllvm-prefix per platform
          LLVM_PREFIX_ARG=""
          case "${{ runner.os }}" in
            macOS)
              if [ -d "/opt/homebrew/opt/llvm@${LLVM_VERSION}" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/opt/homebrew/opt/llvm@${LLVM_VERSION}"
              elif [ -d "/opt/homebrew/opt/llvm" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/opt/homebrew/opt/llvm"
              fi
              ;;
            Windows)
              if [ -d "C:/llvm-${LLVM_VERSION}" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=C:/llvm-${LLVM_VERSION}"
              fi
              ;;
            Linux)
              if [ -d "/usr/lib/llvm-${LLVM_VERSION}" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/usr/lib/llvm-${LLVM_VERSION}"
              fi
              ;;
          esac

          # Use bootstrapped sig to rebuild itself with LLVM enabled
          "${BOOTSTRAP}" build \
            --zig-lib-dir lib \
            -Denable-llvm \
            -Dstatic-llvm \
            ${LLVM_PREFIX_ARG} \
            -Doptimize=ReleaseSafe \
            -Dno-lib \
            -Dno-langref \
            -Dskip-tests \
            --prefix "${OUT}"
          echo "LLVM-enabled sig built successfully"
          ls -la "${OUT}/bin/"
        timeout-minutes: 240

      - name: Install lib
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/lib/sig"
          cp -r lib/. "${OUT}/lib/sig/"

      # --- Verify LLVM-enabled binary ---
      - name: Verify binary exists
        shell: bash
        run: |
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${BIN}"
          [ ! -f "$FILE" ] && echo "ERROR: $FILE not found" && exit 1
          if [ "${{ matrix.target }}" = "x86_64-windows" ]; then
            MAGIC=$(od -A n -t x1 -N 2 "$FILE" | tr -d ' ')
            [ "$MAGIC" != "4d5a" ] && echo "ERROR: Not PE (magic: $MAGIC)" && exit 1
          fi
          echo "OK: $(ls -la "$FILE")"

      - name: Verify have_llvm=true
        shell: bash
        run: |
          FOUND=false
          for f in .sig-cache/config.sig .sig-cache/build_options.sig .sig-cache/config.zig .sig-cache/build_options.zig; do
            if [ -f "$f" ] && grep -q 'have_llvm = true' "$f" 2>/dev/null; then
              echo "VERIFIED: $f contains have_llvm = true"
              FOUND=true; break
            fi
          done
          if [ "$FOUND" = "false" ]; then
            CONFIG_FILE=$(find .sig-cache -maxdepth 3 \( -name 'config.*' -o -name 'build_options.*' \) -type f 2>/dev/null | head -20)
            for f in $CONFIG_FILE; do
              if grep -q 'have_llvm = true' "$f" 2>/dev/null; then
                echo "VERIFIED: $f contains have_llvm = true"
                FOUND=true; break
              fi
            done
          fi
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${BIN}"
          if command -v strings &>/dev/null; then
            if strings "$FILE" 2>/dev/null | grep -q 'have_llvm'; then
              echo "VERIFIED: binary contains have_llvm string"
              FOUND=true
            fi
          fi
          if [ "$FOUND" = "false" ]; then
            echo "WARNING: Could not verify have_llvm=true in build output"
            echo "Proceeding — LLVM flags were passed to the build"
          fi

      - name: Package tarball
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $archive = "sig-${{ env.VERSION }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "sig-${{ env.VERSION }}-${{ matrix.target }}" -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          elif command -v shasum &>/dev/null; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            certutil -hashfile "${ARCHIVE}" SHA256 | head -2 | tail -1 | tr -d ' ' \
              | awk -v f="${ARCHIVE}" '{print $1 "  " f}' > "${ARCHIVE}.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts || { echo "No artifacts"; exit 1; }
          cat *.sha256 > sha256sums.txt 2>/dev/null || true

          PRERELEASE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          [ -z "$ARCHIVES" ] && echo "No archives" && exit 1
          gh release delete "sig-${VERSION}" --yes 2>/dev/null || true
          gh release create "sig-${VERSION}" --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION}" \
            ${PRERELEASE} $ARCHIVES sha256sums.txt
