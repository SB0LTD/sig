# [sig] Release pipeline — LLVM-enabled builds via two-stage bootstrap
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-dev)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            runner: ubuntu-latest
          - target: aarch64-linux
            zig_target: aarch64-linux-musl
            ext: tar.xz
            runner: ubuntu-latest
          - target: aarch64-macos
            zig_target: aarch64-macos
            ext: tar.xz
            runner: macos-latest
          - target: x86_64-windows
            zig_target: x86_64-windows
            ext: zip
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/.*sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/.*sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/.*sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/.*sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}+zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # --- TRANSITIONAL: Use zig for 0.1.1 bootstrap ---
      # Once 0.1.1 is released, replace this with "Download sig" step
      # that downloads the 0.1.1 binary for self-hosting bootstrap.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # --- Install LLVM 21.x dev packages ---
      - name: Install LLVM 21.x (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -y
          sudo apt-get install -y llvm-21-dev libclang-21-dev liblld-21-dev

      - name: Install LLVM 21.x (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@21

      - name: Install LLVM 21.x (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=21.0.0 --allow-downgrade -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- Cache ---
      - name: Cache LLVM packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-21
            /opt/homebrew/opt/llvm@21
            C:\Program Files\LLVM
          key: llvm-21-${{ matrix.target }}-${{ runner.os }}
          restore-keys: llvm-21-${{ matrix.target }}-

      - name: Cache sig-cache and zigcpp objects
        uses: actions/cache@v4
        with:
          path: |
            .sig-cache
            .sig-cache/zigcpp
          key: sig-cache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: sig-cache-${{ matrix.target }}-

      # --- Stage 1: Bootstrap sig without LLVM (direct sig build-exe) ---
      - name: Write build_options.sig (bootstrap)
        shell: bash
        run: |
          mkdir -p .sig-cache
          cat > .sig-cache/build_options.sig << 'ENDOPTS'
          pub const have_llvm = false;
          pub const llvm_has_m68k = false;
          pub const llvm_has_csky = false;
          pub const llvm_has_arc = false;
          pub const llvm_has_xtensa = false;
          pub const version: [:0]const u8 = "0.16.0-dev";
          pub const semver = @import("std").SemanticVersion.parse(version) catch unreachable;
          pub const enable_debug_extensions = false;
          pub const enable_logging = false;
          pub const enable_link_snapshots = false;
          pub const enable_tracy = false;
          pub const value_tracing = false;
          pub const skip_non_native = false;
          pub const debug_gpa = false;
          pub const dev = .full;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode = .direct;
          pub const sig_version: [:0]const u8 = "0.1.1";
          pub const mem_leak_frames = 4;
          ENDOPTS

      - name: Bootstrap sig (stage 1 — no LLVM)
        shell: bash
        run: |
          mkdir -p .sig-cache/bootstrap
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          zig build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.sig-cache/build_options.sig \
            -Maro=lib/compiler/aro/aro.zig \
            -O ReleaseSafe \
            -femit-bin=".sig-cache/bootstrap/${BIN}" \
            --cache-dir .sig-cache \
            --zig-lib-dir lib
          echo "Bootstrap sig built successfully"
          ls -la ".sig-cache/bootstrap/"
        timeout-minutes: 60

      # --- Stage 2: Rebuild sig with LLVM using bootstrapped sig ---
      - name: Build sig with LLVM (stage 2)
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          BOOTSTRAP=".sig-cache/bootstrap/${BIN}"

          # Determine -Dllvm-prefix per platform
          LLVM_PREFIX_ARG=""
          case "${{ runner.os }}" in
            macOS)
              # Homebrew installs LLVM outside default PATH
              if [ -d "/opt/homebrew/opt/llvm@21" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/opt/homebrew/opt/llvm@21"
              elif [ -d "/opt/homebrew/opt/llvm" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/opt/homebrew/opt/llvm"
              fi
              ;;
            Windows)
              if [ -d "/c/Program Files/LLVM" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=C:/Program Files/LLVM"
              fi
              ;;
            Linux)
              # LLVM 21 from apt.llvm.org installs to /usr/lib/llvm-21
              if [ -d "/usr/lib/llvm-21" ]; then
                LLVM_PREFIX_ARG="-Dllvm-prefix=/usr/lib/llvm-21"
              fi
              ;;
          esac

          # Use bootstrapped sig to rebuild itself with LLVM enabled
          "${BOOTSTRAP}" build \
            -Denable-llvm \
            -Dstatic-llvm \
            ${LLVM_PREFIX_ARG} \
            -Doptimize=ReleaseSafe \
            -femit-bin="${OUT}/bin/${BIN}"
          echo "LLVM-enabled sig built successfully"
          ls -la "${OUT}/bin/"
        timeout-minutes: 120

      - name: Install lib
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/lib/sig"
          cp -r lib/. "${OUT}/lib/sig/"

      # --- Verify LLVM-enabled binary ---
      - name: Verify binary exists
        shell: bash
        run: |
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${BIN}"
          [ ! -f "$FILE" ] && echo "ERROR: $FILE not found" && exit 1
          if [ "${{ matrix.target }}" = "x86_64-windows" ]; then
            MAGIC=$(od -A n -t x1 -N 2 "$FILE" | tr -d ' ')
            [ "$MAGIC" != "4d5a" ] && echo "ERROR: Not PE (magic: $MAGIC)" && exit 1
          fi
          echo "OK: $(ls -la "$FILE")"

      - name: Verify have_llvm=true
        shell: bash
        run: |
          # Check the generated config.sig / build_options.sig in the cache
          # for have_llvm = true, confirming LLVM was linked
          FOUND=false
          for f in .sig-cache/config.sig .sig-cache/build_options.sig; do
            if [ -f "$f" ]; then
              if grep -q 'have_llvm = true' "$f"; then
                echo "VERIFIED: $f contains have_llvm = true"
                FOUND=true
                break
              fi
            fi
          done
          # Also check the binary itself for the embedded string
          BIN="sig"; [ "${{ matrix.target }}" = "x86_64-windows" ] && BIN="sig.exe"
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${BIN}"
          if strings "$FILE" 2>/dev/null | grep -q 'have_llvm'; then
            echo "VERIFIED: binary contains have_llvm string"
            FOUND=true
          fi
          if [ "$FOUND" = "false" ]; then
            echo "ERROR: Could not verify have_llvm=true in build output"
            echo "Checking cache directory contents:"
            find .sig-cache -name '*.sig' -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Package tarball
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.zip"
          7z a -tzip "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Checksum
        shell: bash
        run: sha256sum "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts || { echo "No artifacts"; exit 1; }
          cat *.sha256 > sha256sums.txt 2>/dev/null || true
          PRERELEASE="${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true') && '--prerelease' || '' }}"
          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          [ -z "$ARCHIVES" ] && echo "No archives" && exit 1
          gh release delete "sig-${VERSION}" --yes 2>/dev/null || true
          gh release create "sig-${VERSION}" --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION}" \
            ${PRERELEASE} $ARCHIVES sha256sums.txt
