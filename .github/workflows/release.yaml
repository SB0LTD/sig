# [sig] Self-sustained release pipeline ╬ô├ç├╢ sig builds sig
#
# All targets cross-compiled from Linux using the Linux bootstrap.
# Each target uses its own LLVM package (cross-compiled for that target).
# This matches upstream zig's approach: zig-bootstrap cross-compiles everything.
#
# Chain: build-llvm (one-time) ╬ô├Ñ├å build-bootstrap (one-time) ╬ô├Ñ├å release (every release)
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v13'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ github.event.client_payload.bootstrap_tag || inputs.bootstrap_tag || 'bootstrap-sig-v28' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            bin: sig
            llvm_asset: llvm-22-x86_64-linux.tar.xz
          - target: aarch64-macos
            zig_target: aarch64-macos-none
            ext: tar.xz
            bin: sig
            llvm_asset: llvm-22-aarch64-macos.tar.xz
          - target: x86_64-windows
            zig_target: x86_64-windows-gnu
            ext: zip
            bin: sig.exe
            llvm_asset: llvm-22-x86_64-windows.tar.xz
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Determine version source file (build.sig preferred, build.zig fallback)
          if [ -f "build.sig" ]; then
            VER_FILE="build.sig"
          else
            VER_FILE="build.zig"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/^const sig_version.*major = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_MINOR=$(sed -n 's/^const sig_version.*minor = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_PATCH=$(sed -n 's/^const sig_version.*patch = \([0-9]*\).*/\1/p' "$VER_FILE" | head -1)
            SIG_PRE=$(sed -n 's/^const sig_version.*pre = "\([^"]*\)".*/\1/p' "$VER_FILE" | head -1)
            # Fallback: if struct format didn't match, try string format (build.zig)
            if [ -z "$SIG_MAJOR" ]; then
              SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' "$VER_FILE" | head -1)
            else
              [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                                || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
            fi
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.zig | head -1)
          if [ -z "$ZIG_MAJOR" ] || [ -z "$ZIG_MINOR" ] || [ -z "$ZIG_PATCH" ]; then
            echo "ERROR: failed to extract zig_version from build.zig"
            exit 1
          fi
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} for ${{ matrix.target }} (version source: ${VER_FILE})"

      - name: Download bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bootstrap needs libc++ (built with -stdlib=libc++)
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "bootstrap-sig-x86_64-linux.*" --dir /tmp
          BOOTSTRAP_ARCHIVE=$(ls /tmp/bootstrap-sig-x86_64-linux.* | head -1)
          mkdir -p /tmp/bootstrap
          tar -xf "$BOOTSTRAP_ARCHIVE" -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f -name "sig" | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: sig binary not found in bootstrap archive"
            exit 1
          fi
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          echo "SIG=${BIN}" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname "$(dirname "$BIN")")/lib"
          "${BIN}" version || true

      - name: Download LLVM 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "${{ matrix.llvm_asset }}" --dir /tmp
          mkdir -p llvm-22
          tar -xJf "/tmp/${{ matrix.llvm_asset }}" -C llvm-22 --strip-components=1
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build stage3
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          echo "Building ${{ matrix.zig_target }} (version: ${ZIG_VER_BASE})"

          # Generate build_options.zig in a separate directory (can't be in project root — conflicts with root module)
          mkdir -p .build-gen
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          # Direct build-exe with full module wiring (bypasses build.sig CLI limitations)
          mkdir -p stage3-out/bin
          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseFast \
            -fstrip \
            --zig-lib-dir lib \
            -target ${{ matrix.zig_target }} \
            --cache-dir .zig-cache \
            -femit-bin=stage3-out/bin/${{ matrix.bin }}

      - name: Package
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          if [ -f "stage3-out/bin/zig.exe" ]; then
            cp "stage3-out/bin/zig.exe" "${OUT}/bin/${{ matrix.bin }}"
          elif [ -f "stage3-out/bin/zig" ]; then
            cp "stage3-out/bin/zig" "${OUT}/bin/${{ matrix.bin }}"
          fi
          case "${{ matrix.bin }}" in
            sig)     cp "${OUT}/bin/sig" "${OUT}/bin/zig" ;;
            sig.exe) cp "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe" ;;
          esac
          cp -r lib "${OUT}/lib"
          echo "Size: $(du -h "${OUT}/bin/${{ matrix.bin }}" | cut -f1)"

      - name: Verify
        run: |
          if [ "${{ matrix.target }}" = "x86_64-linux" ]; then
            chmod +x "sig-${VERSION}-${{ matrix.target }}/bin/sig"
            "./sig-${VERSION}-${{ matrix.target }}/bin/sig" version
          fi

      - name: Archive (tar.xz)
        if: matrix.ext == 'tar.xz'
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.zip"
          cd "sig-${VERSION}-${{ matrix.target }}" && zip -r "../${ARCHIVE}" . && cd ..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          cat *.sha256 > sha256sums.txt 2>/dev/null || true
          PRERELEASE=""
          LATEST_FLAG="--latest"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ] && PRERELEASE="--prerelease" && LATEST_FLAG=""
          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          gh release delete "sig-${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create "sig-${VERSION}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} ╬ô├ç├╢ self-sustained release (sig builds sig)." \
            ${LATEST_FLAG} ${PRERELEASE} \
            $ARCHIVES sha256sums.txt
