# [sig] Self-sustained release pipeline — sig builds sig
#
# Uses LLVM-enabled bootstrap sig from build-bootstrap to compile the final
# release binaries. No upstream zig dependency at release time.
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v8'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag || 'bootstrap-sig-v8' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            host: x86_64-linux
            zig_target: x86_64-linux-musl
            runner: ubuntu-latest
            ext: tar.xz
            bin: sig
          - target: aarch64-macos
            host: aarch64-macos
            zig_target: aarch64-macos-none
            runner: macos-14
            ext: tar.xz
            bin: sig
          - target: x86_64-windows
            host: x86_64-windows
            zig_target: x86_64-windows-gnu
            runner: windows-latest
            ext: zip
            bin: sig.exe
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/.*sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/.*sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/.*sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/.*sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                              || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}+zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} for ${{ matrix.target }}"

      # ── Download bootstrap sig (has LLVM — self-sustained from here) ──
      - name: Download bootstrap sig
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="bootstrap-sig-${{ matrix.host }}.tar.gz"
          echo "Downloading ${ASSET} from ${{ env.BOOTSTRAP_TAG }}..."
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "${ASSET}" --dir /tmp
          mkdir -p /tmp/bootstrap
          tar -xzf "/tmp/${ASSET}" -C /tmp/bootstrap

          # Find the binary
          BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "sig.exe" -o -name "zig" -o -name "zig.exe" \) | head -1)
          [ -z "$BIN" ] && echo "ERROR: no sig/zig binary in archive" && ls -laR /tmp/bootstrap && exit 1
          chmod +x "$BIN"

          # macOS quarantine
          if [ "${{ runner.os }}" = "macOS" ]; then
            xattr -cr /tmp/bootstrap 2>/dev/null || true
            codesign --force --sign - "$BIN" 2>/dev/null || true
          fi

          BIN_DIR=$(dirname "$BIN")
          echo "${BIN_DIR}" >> "$GITHUB_PATH"
          echo "BOOTSTRAP_BIN=${BIN}" >> "$GITHUB_ENV"

          # zig2 needs lib/ next to its binary for internal operations
          ln -sf "$(pwd)/lib" "${BIN_DIR}/../lib" 2>/dev/null || cp -r lib "${BIN_DIR}/../lib" 2>/dev/null || true

          echo "Bootstrap binary: ${BIN}"
          "${BIN}" version || true

      # ── Download pre-built LLVM 22 for C++ compilation ──
      - name: Download LLVM 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ runner.os }}" in
            Linux)   ASSET="llvm-22-x86_64-linux.tar.xz" ;;
            macOS)   ASSET="llvm-22-aarch64-macos.tar.xz" ;;
            Windows) ASSET="llvm-22-x86_64-windows.tar.xz" ;;
          esac
          echo "Downloading ${ASSET}..."
          gh release download llvm-22 --pattern "${ASSET}" --dir /tmp
          mkdir -p "$PWD/llvm-22"
          tar -xJf "/tmp/${ASSET}" -C "$PWD/llvm-22" --strip-components=1
          rm "/tmp/${ASSET}"
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      # ── Build sig using bootstrap sig (self-sustained, no zig) ─────────
      - name: Build sig
        shell: bash
        run: |
          SIG="${BOOTSTRAP_BIN}"
          TARGET="${{ matrix.zig_target }}"
          MCPU="baseline"
          OUT="sig-${VERSION}-${{ matrix.target }}"

          if [ "${{ runner.os }}" != "Windows" ]; then
            ulimit -s unlimited 2>/dev/null || ulimit -s 65536 2>/dev/null || true
          fi

          # Stage 3: bootstrap sig builds the release sig
          # The bootstrap has LLVM so it can cross-compile and self-host.
          "${SIG}" build \
            --zig-lib-dir lib \
            -Denable-llvm \
            -Dstatic-llvm \
            -Dllvm-prefix="${LLVM_PREFIX}" \
            -Doptimize=ReleaseSafe \
            -Dtarget="${TARGET}" \
            -Dno-lib \
            -Dno-langref \
            -Dskip-tests \
            --prefix "${OUT}"

          echo "Release binary built:"
          ls -la "${OUT}/bin/"
        timeout-minutes: 300

      - name: Install lib
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          cp -r lib "${OUT}/lib"

      - name: Verify binary
        shell: bash
        run: |
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${{ matrix.bin }}"
          [ ! -f "$FILE" ] && echo "ERROR: $FILE not found" && ls -laR "sig-${VERSION}-${{ matrix.target }}/" && exit 1
          echo "OK: $(file "$FILE" 2>/dev/null || echo "$FILE exists")"
          echo "Size: $(ls -la "$FILE" | awk '{print $5}') bytes"

      # ── Stage 4 verification: release sig builds itself ────────────────
      - name: Verify self-hosting (stage 4)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          STAGE3="sig-${VERSION}-${{ matrix.target }}/bin/${{ matrix.bin }}"
          "${STAGE3}" build \
            --zig-lib-dir lib \
            --prefix stage4 \
            -Denable-llvm \
            -Dno-lib \
            -Doptimize=ReleaseSafe \
            -Dtarget=${{ matrix.zig_target }} \
            -Dskip-tests

          echo "Stage 4 built — verifying byte-for-byte identical..."
          diff "${STAGE3}" "stage4/bin/${{ matrix.bin }}" && echo "PASS: stage3 == stage4" \
            || echo "WARNING: stage3 and stage4 differ (nondeterminism)"
        timeout-minutes: 60

      - name: Package tarball
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $archive = "sig-${{ env.VERSION }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "sig-${{ env.VERSION }}-${{ matrix.target }}" -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          elif command -v shasum &>/dev/null; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            certutil -hashfile "${ARCHIVE}" SHA256 | head -2 | tail -1 | tr -d ' ' \
              | awk -v f="${ARCHIVE}" '{print $1 "  " f}' > "${ARCHIVE}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # ── Publish release ────────────────────────────────────────────────────
  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          cat *.sha256 > sha256sums.txt 2>/dev/null || true

          PRERELEASE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          [ -z "$ARCHIVES" ] && echo "No archives found" && ls -la && exit 1

          gh release delete "sig-${VERSION}" --yes 2>/dev/null || true
          gh release create "sig-${VERSION}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} — self-sustained release (sig builds sig, no upstream zig dependency)." \
            ${PRERELEASE} \
            $ARCHIVES sha256sums.txt
