# [sig] Self-sustained release pipeline — sig builds sig
#
# Two-stage build: first produce a native x86_64-linux binary using the v31 bootstrap,
# then use that freshly-built binary to cross-compile for all other targets.
# This mirrors upstream zig-bootstrap's approach.
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: release

concurrency:
  group: sig-release
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v31'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ github.event.client_payload.bootstrap_tag || inputs.bootstrap_tag || 'bootstrap-sig-v31' }}

jobs:
  # Stage 1: Build native x86_64-linux binary using the current bootstrap.
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -f "build.sig" ]; then
            VER_FILE="build.sig"
          else
            VER_FILE="build.zig"
          fi

          SOURCE_SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' "$VER_FILE" | head -1)
          if [ -z "$SOURCE_SIG_VER" ]; then
            echo "ERROR: failed to extract sig_version_string from ${VER_FILE}"
            exit 1
          fi
          REQUESTED_VERSION="${{ github.event.client_payload.version || inputs.version }}"
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$SOURCE_SIG_VER" ]; then
            echo "ERROR: requested release ${REQUESTED_VERSION} does not match source version ${SOURCE_SIG_VER}"
            exit 1
          fi
          SIG_VER="$SOURCE_SIG_VER"
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.zig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.zig | head -1)
          if [ -z "$ZIG_MAJOR" ] || [ -z "$ZIG_MINOR" ] || [ -z "$ZIG_PATCH" ]; then
            echo "ERROR: failed to extract zig_version from build.zig"
            exit 1
          fi
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} (native x86_64-linux stage)"

      - name: Download bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libc++1 libc++abi1
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "bootstrap-sig-x86_64-linux.*" --dir /tmp
          BOOTSTRAP_ARCHIVE=$(ls /tmp/bootstrap-sig-x86_64-linux.* | head -1)
          mkdir -p /tmp/bootstrap
          tar -xf "$BOOTSTRAP_ARCHIVE" -C /tmp/bootstrap
          BIN=$(find /tmp/bootstrap -type f -name "sig" | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: sig binary not found in bootstrap archive"
            exit 1
          fi
          chmod +x "$BIN"
          echo "SIG=${BIN}" >> "$GITHUB_ENV"
          ln -sf "$(pwd)/lib" "$(dirname "$(dirname "$BIN")")/lib"
          "${BIN}" version

      - name: Download LLVM 22 (x86_64-linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download llvm-22 --pattern "llvm-22-x86_64-linux.tar.xz" --dir /tmp
          mkdir -p llvm-22
          tar -xJf "/tmp/llvm-22-x86_64-linux.tar.xz" -C llvm-22 --strip-components=1
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"

      - name: Build native sig (x86_64-linux-musl)
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          echo "Building x86_64-linux-musl (version: ${ZIG_VER_BASE}, sig: ${SIG_VER})"

          mkdir -p .build-gen stage3-out/bin
          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = true;
          pub const llvm_has_m68k: bool = true;
          pub const llvm_has_csky: bool = true;
          pub const llvm_has_arc: bool = true;
          pub const llvm_has_xtensa: bool = true;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          # Build LLVM link flags from available static libraries
          LLVM_LINK_FLAGS=""
          for lib in "${LLVM_PREFIX}"/lib/lib*.a; do
            name=$(basename "$lib" .a | sed 's/^lib//')
            LLVM_LINK_FLAGS="$LLVM_LINK_FLAGS -l${name}"
          done

          "${SIG}" build-exe \
            -cflags -std=c++17 -fno-exceptions -fno-rtti -fno-stack-protector -DNDEBUG -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS -I${LLVM_PREFIX}/include -isystem lib/libcxx/include -isystem lib/libcxxabi/include -- \
            src/zig_llvm.cpp src/zig_llvm-ar.cpp src/zig_clang_driver.cpp src/zig_clang_cc1_main.cpp src/zig_clang_cc1as_main.cpp \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseFast \
            -fstrip \
            --zig-lib-dir lib \
            -target x86_64-linux-musl \
            --cache-dir .zig-cache \
            -lc \
            -lc++ \
            -L "${LLVM_PREFIX}/lib" \
            $LLVM_LINK_FLAGS \
            -femit-bin=stage3-out/bin/sig

      - name: Verify native binary
        run: |
          chmod +x stage3-out/bin/sig
          ./stage3-out/bin/sig version
          rm -rf /tmp/sig-release-cache /tmp/sig-release-global
          ./stage3-out/bin/sig test test/release/nexus_compat.sig \
            --zig-lib-dir lib \
            --cache-dir /tmp/sig-release-cache \
            --global-cache-dir /tmp/sig-release-global
          ./stage3-out/bin/sig build-obj test/release/nexus_compat.sig \
            -target aarch64-freestanding-none \
            -OReleaseSmall \
            -fllvm \
            --zig-lib-dir lib \
            --cache-dir /tmp/sig-release-cache \
            --global-cache-dir /tmp/sig-release-global \
            -femit-bin=/tmp/nexus-compat-aarch64.o
          file /tmp/nexus-compat-aarch64.o | grep -q "ARM aarch64"

      - name: Package native binary
        run: |
          OUT="sig-${VERSION}-x86_64-linux"
          mkdir -p "${OUT}/bin"
          cp stage3-out/bin/sig "${OUT}/bin/sig"
          ln "${OUT}/bin/sig" "${OUT}/bin/zig"
          cp -r lib "${OUT}/lib"
          echo "Size: $(du -h "${OUT}/bin/sig" | cut -f1)"
          ARCHIVE="sig-${VERSION}-x86_64-linux.tar.xz"
          tar -cJf "${ARCHIVE}" "${OUT}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          sha256sum -c "${ARCHIVE}.sha256"

          mkdir -p /tmp/sig-release-check
          tar -xJf "${ARCHIVE}" -C /tmp/sig-release-check
          PACKAGED="/tmp/sig-release-check/${OUT}/bin/sig"
          "${PACKAGED}" version
          "${PACKAGED}" test test/release/nexus_compat.sig \
            --cache-dir /tmp/sig-package-cache \
            --global-cache-dir /tmp/sig-package-global

      - uses: actions/upload-artifact@v4
        with:
          name: sig-x86_64-linux
          path: |
            sig-${{ env.VERSION }}-x86_64-linux.tar.xz
            sig-${{ env.VERSION }}-x86_64-linux.tar.xz.sha256

  # Native builds on macOS using its own platform bootstrap.
  # Windows is cross-compiled from Linux (native bootstrap has C-backend UB).
  # sig builds sig — bootstrap is sig, output is sig.
  build-platform:
    needs: build-native
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-macos
            bootstrap_asset: bootstrap-sig-aarch64-macos.tar.gz
            ext: tar.xz
            bin: sig
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .bootstrap-dl .bootstrap
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "${{ matrix.bootstrap_asset }}" --dir .bootstrap-dl
          tar -xf ".bootstrap-dl/${{ matrix.bootstrap_asset }}" -C .bootstrap
          # Copy bootstrap binary to workspace root for reliable execution
          if [ -f .bootstrap/bin/sig.exe ]; then
            cp .bootstrap/bin/sig.exe ./bootstrap-sig.exe
          else
            cp .bootstrap/bin/sig ./bootstrap-sig
            chmod +x ./bootstrap-sig
          fi
          ./bootstrap-sig* version

      - name: Generate build options
        shell: bash
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          mkdir -p .build-gen stage3-out/bin
          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

      - name: Build sig natively
        shell: bash
        run: |
          echo "Building ${{ matrix.target }} natively (sig builds sig, no-LLVM)"
          ./bootstrap-sig build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseSafe \
            --zig-lib-dir lib \
            --cache-dir .zig-cache \
            -femit-bin=stage3-out/bin/${{ matrix.bin }}

      - name: Verify binary
        shell: bash
        run: |
          chmod +x stage3-out/bin/${{ matrix.bin }}
          file stage3-out/bin/${{ matrix.bin }} | grep -q "Mach-O"
          stage3-out/bin/${{ matrix.bin }} version
          stage3-out/bin/${{ matrix.bin }} test test/release/nexus_compat.sig \
            --zig-lib-dir lib \
            --cache-dir /tmp/sig-nexus-cache \
            --global-cache-dir /tmp/sig-nexus-global

      - name: Package
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"
          cp "stage3-out/bin/${{ matrix.bin }}" "${OUT}/bin/${{ matrix.bin }}"
          case "${{ matrix.bin }}" in
            sig)     ln "${OUT}/bin/sig" "${OUT}/bin/zig" ;;
            sig.exe) ln "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe" ;;
          esac
          cp -r lib "${OUT}/lib"

      - name: Archive (tar.xz)
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          shasum -a 256 -c "${ARCHIVE}.sha256"
          mkdir -p /tmp/sig-platform-package-check
          tar -xJf "${ARCHIVE}" -C /tmp/sig-platform-package-check
          PACKAGED="/tmp/sig-platform-package-check/sig-${VERSION}-${{ matrix.target }}/bin/${{ matrix.bin }}"
          "${PACKAGED}" version
          "${PACKAGED}" test test/release/nexus_compat.sig \
            --cache-dir /tmp/sig-platform-package-cache \
            --global-cache-dir /tmp/sig-platform-package-global
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.zip"
          7z a -r "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" 2>/dev/null || certutil -hashfile "${ARCHIVE}" SHA256 > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # Cross-compile Windows from the freshly-built Linux Sig compiler with LLVM.
  build-windows-cross:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean

      - uses: actions/download-artifact@v4
        with:
          name: sig-x86_64-linux
          path: .native-release

      - name: Extract native Sig compiler
        run: |
          ARCHIVE=$(find .native-release -maxdepth 1 -name 'sig-*-x86_64-linux.tar.xz' | head -1)
          test -n "${ARCHIVE}"
          mkdir -p .native-sig
          tar -xJf "${ARCHIVE}" -C .native-sig --strip-components=1
          chmod +x .native-sig/bin/sig
          .native-sig/bin/sig version
          echo "SIG=$PWD/.native-sig/bin/sig" >> "$GITHUB_ENV"

      - name: Cross-compile for Windows
        run: |
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          SIG_VER=$(sed -n 's/^const sig_version_string = "\([^"]*\)".*/\1/p' build.sig | head -1)
          mkdir -p .build-gen stage3-out/bin

          cat > .build-gen/build_options.zig << EOF
          pub const have_llvm: bool = false;
          pub const llvm_has_m68k: bool = false;
          pub const llvm_has_csky: bool = false;
          pub const llvm_has_arc: bool = false;
          pub const llvm_has_xtensa: bool = false;
          pub const enable_logging: bool = false;
          pub const enable_debug_extensions: bool = false;
          pub const enable_link_snapshots: bool = false;
          pub const debug_gpa: bool = false;
          pub const enable_tracy: bool = false;
          pub const enable_tracy_callstack: bool = false;
          pub const enable_tracy_allocation: bool = false;
          pub const tracy_callstack_depth: u32 = 6;
          pub const value_tracing: bool = false;
          pub const mem_leak_frames: u32 = 0;
          pub const io_mode: enum { threaded, evented } = .threaded;
          pub const value_interpret_mode: enum { direct, by_name } = .direct;
          pub const version: [:0]const u8 = "${ZIG_VER_BASE}";
          pub const sig_version: [:0]const u8 = "${SIG_VER}";
          pub const semver: @import("std").SemanticVersion = .{ .major = 0, .minor = 17, .patch = 0 };
          pub const dev: enum { full, bootstrap, ast_gen, sema, cbe, @"aarch64-linux", @"powerpc-linux", @"riscv64-linux", spirv, wasm, @"x86_64-linux" } = .full;
          EOF

          "${SIG}" build-exe \
            --dep build_options --dep aro \
            -Mroot=src/main.zig \
            -Mbuild_options=.build-gen/build_options.zig \
            -Maro=lib/compiler/aro/aro.zig \
            --name sig \
            -OReleaseFast \
            -fstrip \
            --zig-lib-dir lib \
            -target x86_64-windows \
            -fllvm \
            -flld \
            --cache-dir .zig-cache \
            -femit-bin=stage3-out/bin/sig.exe

      - name: Verify PE binary
        run: |
          file stage3-out/bin/sig.exe
          head -c 2 stage3-out/bin/sig.exe | xxd | grep -q "4d5a" || { echo "ERROR: Not a PE binary!"; exit 1; }
          ls -la stage3-out/bin/sig.exe
          echo "Valid PE binary produced"

      - name: Package
        run: |
          OUT="sig-${VERSION}-x86_64-windows"
          mkdir -p "${OUT}/bin"
          cp stage3-out/bin/sig.exe "${OUT}/bin/sig.exe"
          ln "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe"
          cp -r lib "${OUT}/lib"
          ARCHIVE="sig-${VERSION}-x86_64-windows.zip"
          7z a -r "${ARCHIVE}" "${OUT}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          sha256sum -c "${ARCHIVE}.sha256"
          7z t "${ARCHIVE}"
          rm -rf /tmp/sig-windows-package-check
          7z x -o/tmp/sig-windows-package-check "${ARCHIVE}" >/dev/null
          PACKAGED="/tmp/sig-windows-package-check/${OUT}/bin"
          test -f "${PACKAGED}/sig.exe"
          test -f "${PACKAGED}/zig.exe"
          cmp "${PACKAGED}/sig.exe" "${PACKAGED}/zig.exe"
          head -c 2 "${PACKAGED}/sig.exe" | xxd | grep -q "4d5a"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: sig-x86_64-windows
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  verify-windows:
    needs: [build-native, build-windows-cross]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sig-x86_64-windows
          path: .windows-release

      - name: Verify packaged Windows compiler
        shell: pwsh
        run: |
          $archive = Get-ChildItem .windows-release -Filter 'sig-*-x86_64-windows.zip' | Select-Object -First 1
          if (-not $archive) {
            throw 'Windows release archive was not downloaded'
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath .windows-package
          $package = Join-Path $PWD "windows-package\sig-${env:VERSION}-x86_64-windows"
          $sig = Join-Path $package 'bin\sig.exe'
          $zig = Join-Path $package 'bin\zig.exe'
          if (-not (Test-Path -LiteralPath $sig) -or -not (Test-Path -LiteralPath $zig)) {
            throw 'Packaged sig.exe or zig.exe is missing'
          }
          if ((Get-FileHash $sig).Hash -ne (Get-FileHash $zig).Hash) {
            throw 'Packaged sig.exe and zig.exe differ'
          }

          & $sig version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged sig.exe version failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force .windows-cache, .windows-global-cache | Out-Null
          & $sig test test\release\nexus_compat.sig `
            --cache-dir .windows-cache `
            --global-cache-dir .windows-global-cache
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged sig.exe compatibility test failed with exit code $LASTEXITCODE"
          }

  publish:
    needs: [build-native, build-platform, build-windows-cross, verify-windows]
    if: >-
      needs.build-native.result == 'success' &&
      needs.build-platform.result == 'success' &&
      needs.build-windows-cross.result == 'success' &&
      needs.verify-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-native.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          test -f "sig-${VERSION}-x86_64-linux.tar.xz"
          test -f "sig-${VERSION}-aarch64-macos.tar.xz"
          test -f "sig-${VERSION}-x86_64-windows.zip"

          cp "sig-${VERSION}-x86_64-linux.tar.xz" sig-x86_64-linux.tar.xz
          cp "sig-${VERSION}-aarch64-macos.tar.xz" sig-aarch64-macos.tar.xz
          cp "sig-${VERSION}-x86_64-windows.zip" sig-x86_64-windows.zip

          sha256sum sig-*.tar.xz sig-*.zip > sha256sums.txt
          sha256sum -c sha256sums.txt
          PRERELEASE=""
          LATEST_FLAG="--latest"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ] && PRERELEASE="--prerelease" && LATEST_FLAG=""
          shopt -s nullglob
          ARCHIVES=(sig-*.tar.xz sig-*.zip)
          gh release delete "sig-${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create "sig-${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} — self-sustained release. Linux is built by Sig with LLVM 22, Windows is cross-compiled by that Linux Sig, and all platform jobs must pass before publication." \
            ${LATEST_FLAG} ${PRERELEASE} \
            "${ARCHIVES[@]}" sha256sums.txt
