# [sig] Self-sustained release pipeline — sig builds sig
#
# Uses LLVM-enabled bootstrap sig from build-bootstrap to compile the final
# release binaries via stage3 self-compilation. No upstream zig dependency.
#
# The bootstrap (zig2) is a C-compiled debug binary that can crash on Windows
# due to /FORCE:MULTIPLE linker issues. To work around this, ALL targets are
# cross-compiled from the Linux runner using the Linux bootstrap (which works
# reliably). This mirrors upstream zig's release strategy.
#
# Chain: build-llvm (one-time) → build-bootstrap (one-time) → release (every release)
name: release

on:
  repository_dispatch:
    types: [sig-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean
      bootstrap_tag:
        description: 'Bootstrap release tag to use'
        required: false
        default: 'bootstrap-sig-v13'
        type: string

permissions:
  contents: write

env:
  BOOTSTRAP_TAG: ${{ github.event.client_payload.bootstrap_tag || inputs.bootstrap_tag || 'bootstrap-sig-v13' }}

jobs:
  build:
    # All targets are cross-compiled from Linux to avoid Windows bootstrap crash
    # (zig2.exe built with /FORCE:MULTIPLE causes heap corruption on Windows)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            ext: tar.xz
            bin: sig
          - target: aarch64-macos
            zig_target: aarch64-macos-none
            ext: tar.xz
            bin: sig
          - target: x86_64-windows
            zig_target: x86_64-windows-gnu
            ext: zip
            bin: sig.exe
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            SIG_VER="${{ inputs.version }}"
          else
            SIG_MAJOR=$(sed -n 's/^const sig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_MINOR=$(sed -n 's/^const sig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PATCH=$(sed -n 's/^const sig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
            SIG_PRE=$(sed -n 's/^const sig_version.*pre = "\([^"]*\)".*/\1/p' build.sig | head -1)
            [ -n "$SIG_PRE" ] && SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}-${SIG_PRE}" \
                              || SIG_VER="${SIG_MAJOR}.${SIG_MINOR}.${SIG_PATCH}"
          fi
          ZIG_MAJOR=$(sed -n 's/.*zig_version.*major = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_MINOR=$(sed -n 's/.*zig_version.*minor = \([0-9]*\).*/\1/p' build.sig | head -1)
          ZIG_PATCH=$(sed -n 's/.*zig_version.*patch = \([0-9]*\).*/\1/p' build.sig | head -1)
          VERSION="${SIG_VER}-zig${ZIG_MAJOR}.${ZIG_MINOR}.${ZIG_PATCH}.$(git rev-parse --short=7 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building sig ${VERSION} for ${{ matrix.target }}"

      # ── Download Linux bootstrap (always use Linux — it works reliably) ──
      - name: Download bootstrap sig
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="bootstrap-sig-x86_64-linux.tar.gz"
          echo "Downloading ${ASSET} from ${{ env.BOOTSTRAP_TAG }}..."
          gh release download "${{ env.BOOTSTRAP_TAG }}" --pattern "${ASSET}" --dir /tmp
          mkdir -p /tmp/bootstrap
          tar -xzf "/tmp/${ASSET}" -C /tmp/bootstrap

          # Find the binary
          BIN=$(find /tmp/bootstrap -type f \( -name "sig" -o -name "zig" -o -name "zig2" \) | head -1)
          [ -z "$BIN" ] && echo "ERROR: no sig/zig binary in archive" && ls -laR /tmp/bootstrap && exit 1
          chmod +x "$BIN"

          BIN_DIR=$(dirname "$BIN")
          echo "${BIN_DIR}" >> "$GITHUB_PATH"
          echo "BOOTSTRAP_BIN=${BIN}" >> "$GITHUB_ENV"

          # Bootstrap needs lib/ relative to its binary location
          # The binary looks for ../lib/zig/std/std.zig or ../lib/std/std.zig
          PARENT_DIR=$(dirname "$BIN_DIR")
          ln -sf "$(pwd)/lib" "${PARENT_DIR}/lib" 2>/dev/null || cp -r lib "${PARENT_DIR}/lib"

          echo "Bootstrap binary: ${BIN}"
          "${BIN}" version || true

      # ── Install system dependencies for LLVM linking ─────────────
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev libzstd-dev

      # ── Download pre-built LLVM 22 (needed for -Denable-llvm) ────
      - name: Download LLVM 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LLVM_ASSET="llvm-22-x86_64-linux.tar.xz"
          echo "Downloading ${LLVM_ASSET}..."
          gh release download llvm-22 --pattern "${LLVM_ASSET}" --dir /tmp
          mkdir -p "$PWD/llvm-22"
          tar -xJf "/tmp/${LLVM_ASSET}" -C "$PWD/llvm-22" --strip-components=1
          rm "/tmp/${LLVM_ASSET}"
          # Copy system zlib/zstd static libs into LLVM prefix so cross-compilation finds them
          cp /usr/lib/x86_64-linux-gnu/libz.a "$PWD/llvm-22/lib/" 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libzstd.a "$PWD/llvm-22/lib/" 2>/dev/null || true
          echo "LLVM_PREFIX=$PWD/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM downloaded to $PWD/llvm-22"

      # ── Build stage3 (proper optimized release binary) ──────────────
      - name: Build stage3 release binary
        shell: bash
        run: |
          echo "Building stage3 for ${{ matrix.zig_target }}..."

          # Use the bootstrap to build the optimized stage3 compiler
          # This cross-compiles for the target platform
          # Extract base zig version (M.N.P) — must be valid semver for the build system
          # VERSION format: 0.1.2-zig0.17.0.HASH → strip to 0.17.0
          ZIG_VER_BASE=$(echo "${VERSION}" | sed 's/.*-zig//' | sed 's/\.[0-9a-f]*$//')
          echo "Version string for build: ${ZIG_VER_BASE}"
          "${BOOTSTRAP_BIN}" build \
            --prefix "stage3-out" \
            -Doptimize=ReleaseFast \
            -Dstrip \
            -Dtarget=${{ matrix.zig_target }} \
            -Dno-lib \
            -Denable-llvm \
            -Dstatic-llvm \
            -Dversion-string="${ZIG_VER_BASE}" \
            --zig-lib-dir lib \
            --search-prefix "${LLVM_PREFIX}"

          echo "Stage3 build complete"
          ls -la stage3-out/bin/ || true

      # ── Package release ─────────────────────────────────────────────
      - name: Package release
        shell: bash
        run: |
          OUT="sig-${VERSION}-${{ matrix.target }}"
          mkdir -p "${OUT}/bin"

          # Copy the stage3 binary
          if [ -f "stage3-out/bin/zig" ]; then
            cp "stage3-out/bin/zig" "${OUT}/bin/${{ matrix.bin }}"
          elif [ -f "stage3-out/bin/zig.exe" ]; then
            cp "stage3-out/bin/zig.exe" "${OUT}/bin/${{ matrix.bin }}"
          else
            echo "ERROR: stage3 binary not found"
            find stage3-out -type f | head -20
            exit 1
          fi

          # Also provide the zig-named binary for compatibility
          case "${{ matrix.bin }}" in
            sig)     cp "${OUT}/bin/sig" "${OUT}/bin/zig" ;;
            sig.exe) cp "${OUT}/bin/sig.exe" "${OUT}/bin/zig.exe" ;;
          esac

          # Include the standard library
          cp -r lib "${OUT}/lib"

          echo "Release contents:"
          ls -la "${OUT}/bin/"
          echo "Binary size: $(du -h "${OUT}/bin/${{ matrix.bin }}" | cut -f1)"

      # ── Verify binary ───────────────────────────────────────────────
      - name: Verify binary
        shell: bash
        run: |
          FILE="sig-${VERSION}-${{ matrix.target }}/bin/${{ matrix.bin }}"
          [ ! -f "$FILE" ] && echo "ERROR: $FILE not found" && ls -laR "sig-${VERSION}-${{ matrix.target }}/" && exit 1
          echo "OK: $(file "$FILE" 2>/dev/null || echo "$FILE exists")"
          echo "Size: $(ls -la "$FILE" | awk '{print $5}') bytes"

          # For native target, verify it runs
          if [ "${{ matrix.target }}" = "x86_64-linux" ]; then
            chmod +x "$FILE"
            "./$FILE" version
          fi

      - name: Package tarball
        if: matrix.ext == 'tar.xz'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf "${ARCHIVE}" "sig-${VERSION}-${{ matrix.target }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          ARCHIVE="sig-${VERSION}-${{ matrix.target }}.zip"
          cd "sig-${VERSION}-${{ matrix.target }}"
          zip -r "../${ARCHIVE}" .
          cd ..
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Checksum
        shell: bash
        run: sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # ── Publish release ────────────────────────────────────────────────────
  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sig-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          cat *.sha256 > sha256sums.txt 2>/dev/null || true

          PRERELEASE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          ARCHIVES=""
          for f in sig-*.tar.xz sig-*.zip; do [ -f "$f" ] && ARCHIVES="$ARCHIVES $f"; done
          [ -z "$ARCHIVES" ] && echo "No archives found" && ls -la && exit 1

          gh release delete "sig-${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create "sig-${VERSION}" \
            --title "Sig ${VERSION}" \
            --notes "Sig ${VERSION} — self-sustained release (sig builds sig, no upstream zig dependency)." \
            --latest \
            ${PRERELEASE} \
            $ARCHIVES sha256sums.txt
