name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel in-progress runs on PRs; no limit on pushes/dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ── Tier 1: runs on every PR + push ─────────────────────────────────────────
# Fast, native-arch jobs that give signal quickly.

jobs:
  x86_64-linux-debug:
    runs-on: [self-hosted, x86_64-linux]
    steps:
      - uses: https://codeberg.org/ziglang/checkout@19af6bac491e2534a4687a50ee84fa7f13258d28
        with:
          fetch-depth: 0
      - name: ccache
        uses: https://codeberg.org/ziglang/ccache-action@v1
        with:
          key: x86_64-linux-debug
        continue-on-error: true
      - name: Build and Test
        run: sh ci/x86_64-linux-debug.sh
        timeout-minutes: 180

  x86_64-linux-release:
    runs-on: [self-hosted, x86_64-linux]
    steps:
      - uses: https://codeberg.org/ziglang/checkout@19af6bac491e2534a4687a50ee84fa7f13258d28
        with:
          fetch-depth: 0
      - name: ccache
        uses: https://codeberg.org/ziglang/ccache-action@v1
        with:
          key: x86_64-linux-release
        continue-on-error: true
      - name: Build and Test
        run: sh ci/x86_64-linux-release.sh
        timeout-minutes: 360

  x86_64-linux-debug-llvm:
    runs-on: [self-hosted, x86_64-linux]
    steps:
      - uses: https://codeberg.org/ziglang/checkout@19af6bac491e2534a4687a50ee84fa7f13258d28
