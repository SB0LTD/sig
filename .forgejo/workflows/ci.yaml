  x86_64-windows-release:
    runs-on: [self-hosted, x86_64-windows]
    steps:
      - uses: https://codeberg.org/ziglang/checkout@19af6bac491e2534a4687a50ee84fa7f13258d28
        with:
          fetch-depth: 0
      - name: Build and Test
        run: ci/x86_64-windows-release.ps1
        timeout-minutes: 180

  # [sig] Sig-specific tests — bootstrap sig first, then test/verify/benchmark
  sig-tests:
    runs-on: [self-hosted, x86_64-linux]
    steps:
      - uses: https://codeberg.org/ziglang/checkout@19af6bac491e2534a4687a50ee84fa7f13258d28
        with:
          fetch-depth: 0

      - name: Bootstrap sig build runner
        run: sh bootstrap.sh
        timeout-minutes: 10

      - name: Add sig-out/bin to PATH
        run: echo "$PWD/sig-out/bin" >> $GITHUB_PATH

      - name: Run Sig tests
        run: sig build test-sig
        timeout-minutes: 60

      - name: Verify build runner self-hosting
        run: sig build build-runner
        timeout-minutes: 30

      - name: Verify identical output
        run: sig build --verify-identical
        timeout-minutes: 60

      - name: Benchmark build performance
        run: |
          mkdir -p benchmark-results
          sig build --benchmark | tee benchmark-results/ci-benchmark.txt
        timeout-minutes: 30

      - name: Archive benchmark results
        uses: https://codeberg.org/ziglang/upload-artifact@v4
        with:
          name: sig-benchmark-results
          path: benchmark-results/
          if-no-files-found: ignore

